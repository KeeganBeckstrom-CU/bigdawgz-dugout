 every throw to second."],["LF","Runner on first. Ground ball to the first baseman. He throws to the shortstop at second.","1B","2B",1,"A throw from the right side to second: the left fielder backs it up."],["RF","Runner on first. Ground ball to the third baseman. He throws to second for the force.","3B","2B",1,"A throw from the left side to second: the right fielder backs it up."],["LF","Runner on third. The catcher throws behind the runner at third.","C","3B",2,"Catcher pickoff to third: the left fielder backs it up."],["RF","Batter hits a ground ball to shortstop. Nobody on, two outs.","SS","1B",0,"Every throw to first, the right fielder is behind it. Even with two outs."],["CF","Line drive caught by the pitcher. He throws to second to double off the runner.","P","2B",1,"Any throw to second: the center fielder backs it up."],["RF","Line drive caught by the third baseman. He throws to first to double off the runner.","3B","1B",0,"Any throw to first from the infield: the right fielder backs it up."],["LF","Line drive caught by the shortstop. He throws to third to double off the runner.","SS","3B",2,"A throw to third: the left fielder backs it up."],["RF","One out, runners on first and second. Ground ball to the shortstop. He throws to first.","SS","1B",0,"Throw to first from the infield: the right fielder is behind it."],["RF","One out, runners on first and second. Ground ball to the second baseman. He throws to first.","2B","1B",0,"Throw to first from the infield: the right fielder is behind it."],["RF","One out, runners on first and second. Ground ball to the third baseman. He throws to first.","3B","1B",0,"Throw to first from the infield: the right fielder is behind it."],["RF","Strike three gets past the catcher with nobody on. He picks it up and throws to first.","C","1B",0,"The right fielder backs up first on the dropped third strike throw."],["LF","Nobody on. Single to right. The right fielder throws to second.","RF","2B",1,"A throw from right field to second: the left fielder backs it up."],["RF","Nobody on. Single to left. The left fielder throws to second.","LF","2B",1,"A throw from left field to second: the right fielder backs it up."],["CF","Two outs. Runner on first steals second.","C","2B",1,"Any steal of second: the center fielder backs it up."],["RF","Two outs, runner on first. The pitcher throws over to first.","P","1B",0,"Pickoff to first: right fielder backs it up."],["LF","Two outs, runner on third. The catcher throws a pickoff to third.","C","3B",2,"Catcher to third: left fielder backs it up."],["CF","One out, runner on second. The pitcher spins and throws to second.","P","2B",1,"Pickoff to second: center fielder backs it up."],["P","Runner on first and two outs. Single to right and he's going to third.","RF","3B",2,"Throw to third from the outfield: the pitcher backs it up."],["P","Runner on second, two outs. Single to left and the throw is going home.","LF","H",3,"Throw home from the outfield: the pitcher backs up home."],["C","Nobody on, one out. Ground ball to the shortstop, throw to first.","SS","1B",0,"Nobody on: the catcher runs down the line behind first."]]);
QZ.rules.push(...[["The first baseman catches the throw with his foot on the bag a split second before the runner touches first.",["Out","Safe"],0,"Ball beats runner, foot on the bag: out."],["The throw and the runner get to first at exactly the same time.",["Safe","Out"],0,"A tie goes to the runner. The fielder has to beat him."],["The first baseman catches the throw, but his foot comes off the bag before he catches it.",["Safe","Out"],0,"He has to be touching the base when he catches it."],["The second baseman tags the runner with an empty glove. The ball is in his other hand.",["Safe","Out"],0,"You have to tag with the ball, or with the glove holding the ball."],["The shortstop tags the runner with the glove, and the ball is inside the glove.",["Out","Safe"],0,"Ball in the glove counts as a tag."],["The third baseman tags the runner, then drops the ball while getting up.",["Out","Safe"],0,"If he held it through the tag and dropped it after, it's still an out."],["The catcher tags the runner, but the ball pops out of his glove as the runner slides into him.",["Safe","Out"],0,"He has to hold on to the ball through the tag."],["The runner overslides second base, and the shortstop tags him while he's off the bag.",["Out","Safe"],0,"Second and third aren't like first. If you slide past them, you can be tagged."],["The batter runs through first base and turns toward second, then stops. The first baseman tags him.",["Out","Safe"],0,"If he turns toward second like he's trying to go, he can be tagged out."],["A fly ball hits the outfielder's glove, bounces off his chest, and he catches it before it touches the ground.",["Out","Safe"],0,"As long as it never touches the ground, it's a catch."],["An outfielder catches a fly ball, but it falls out of his glove as he hits the wall.",["Safe","Out"],0,"He has to keep control of the ball. Dropped from the wall, no catch."],["An outfielder catches the ball, then drops it while reaching into his glove to throw.",["Out","Safe"],0,"Once he has full control and drops it on the transfer, it's still a catch."],["The ball is caught by the right fielder, but his foot is on the warning track, inside the fence.",["Out","Safe"],0,"The warning track is still in play. It's a catch."],["A ground ball bounces on the infield, then rolls foul before reaching first base. Nobody touches it.",["Foul","Fair"],0,"Before reaching first or third, it's where it stops or is touched that matters."],["A ground ball rolls fair past third base, then rolls foul in the outfield.",["Fair","Foul"],0,"Once it passes the base in fair ground, it's fair."],["A fly ball lands on the foul side of the line in the outfield, then rolls fair.",["Foul","Fair"],0,"In the outfield, it's where it lands first."],["The ball hits the foul pole above the fence.",["Fair, home run","Foul"],0,"The foul pole is fair. Hitting it is a home run."],["A bunt is rolling down the third-base line in fair ground. The catcher picks it up while it's on the line.",["Fair","Foul"],0,"The line is fair. If he touches it on the line, it's fair."],["A bunt rolls foul and the catcher picks it up in foul territory before it reaches third.",["Foul","Fair"],0,"Touched in foul ground before the base: foul ball."],["The batter swings and misses, and the pitch hits his back foot.",["Strike","Ball","Hit by pitch"],0,"If he swings, it's a strike even if it hits him."],["The batter doesn't swing, and a pitch inside the strike zone hits his elbow.",["Strike","Hit by pitch","Ball"],0,"If the pitch is in the strike zone, it's a strike, not a hit-by-pitch."],["A pitch hits the batter's loose jersey without touching his body.",["Hit by pitch","Ball","Strike"],0,"Touching the uniform counts as hit by pitch."],["The batter is hit by a pitch with the bases loaded.",["Run scores","No run","Dead ball, do over"],0,"He goes to first and everyone is forced up a base. The runner from third scores."],["The batter checks his swing and the bat doesn't go past the front of the plate. The pitch is outside.",["Ball","Strike"],0,"If he didn't go around, it's not a swing."],["The batter bunts at the pitch and pulls the bat back, but the bat was over the plate when the pitch went by. The pitch was outside.",["Ball","Strike"],0,"Pulling it back means he didn't offer. Outside pitch, no swing: ball."],["The batter squares to bunt and pushes the bat at the ball, missing it. The pitch was outside.",["Strike","Ball"],0,"Trying to bunt and missing is a strike, wherever the pitch was."],["A foul ball tip goes straight back off the bat into the catcher's glove and he catches it. One strike on the batter.",["Strike","Foul ball, no strike","Out"],0,"A foul tip caught is a strike, just like a swing and miss. It's only an out on strike three."],["A high foul pop goes over the catcher's head. He catches it.",["Out","Foul ball"],0,"A caught foul fly is an out."],["The batter hits the ball and it hits his own foot while he's still in the batter's box.",["Foul ball","Out","Fair ball"],0,"A batted ball hitting the batter in the box is a foul ball."],["The batter hits the ball, steps out of the box, and the ball bounces up and hits him in fair territory.",["Out","Foul ball"],0,"If he's out of the box in fair ground, he's out for being hit by his own batted ball."],["A runner on second runs to third on a ground ball hit right to the third baseman, who tags him.",["Out","Safe"],0,"Tagged before reaching the base: out."],["Runner on first. Ground ball to the first baseman who steps on first first, then throws to second. The shortstop catches it on the bag but doesn't tag the runner.",["Safe","Out"],0,"Once the batter was out at first, the force was gone. Now the runner has to be tagged."],["Runners on first and second. Ground ball to third. He steps on third.",["Out","Safe"],0,"The runner from second is forced, so stepping on third is an out."],["A runner on third leaves early on a caught fly ball and scores. The defense never appeals.",["Run counts","Run doesn't count"],0,"Leaving early is an appeal play. If the defense doesn't appeal, the run counts."],["A runner touches every base on a home run, but forgets to touch home and goes into the dugout. The defense tags home and appeals.",["Out","Run counts"],0,"He has to touch every base, home included."],["The batter hits a home run over the fence, and passes the runner from first on the bases.",["Batter is out, but the runner's run counts","Both runs count","Nothing happens"],0,"Passing a runner is an out on the batter. The runner in front still scores."],["A runner leaves the base line by more than three feet to avoid a tag.",["Out","Safe"],0,"Running out of the base path to avoid a tag is an out."],["A runner rounds third, sees a throw coming, and runs back to third before the tag.",["Safe","Out"],0,"He got back. Safe."],["Two runners end up standing on third base at the same time. The third baseman tags both.",["The lead runner is safe, the trail runner is out","Both safe","Both out"],0,"Usually the base belongs to the runner who had it first, unless he was forced off."],["Bases loaded. Two runners are standing on third. The lead runner was forced to move up. The third baseman tags both.",["The lead runner is out","The trail runner is out","Both safe"],0,"When the lead runner is forced, the base belongs to the runner behind him."],["Runner on first. The batter walks. Does the runner get second?",["Yes, he's forced","No, he stays"],0,"A walk forces a runner on first to second."],["Runner on second only. The batter walks. Does the runner get third?",["No, he stays","Yes, he's forced"],0,"He's not forced because first base was open."],["Runner on third. The pitcher balks.",["The runner scores","Nothing happens","Ball on the batter only"],0,"On a balk every runner moves up a base."],["The catcher drops strike three with first base empty. He tags the batter before he leaves the area.",["Out","Safe"],0,"On a dropped third strike, a tag or a throw to first gets him out."],["The batter, on a dropped third strike, walks toward the dugout instead of running. He leaves the dirt circle.",["Out","Can still run"],0,"Once he leaves the dirt area around home without trying for first, he's out."],["A fair batted ball hits a runner off the base before an infielder has a chance.",["Runner is out","Play on","Batter is out"],0,"He's out, and the batter gets first base."],["A batted ball goes through the infielder's legs and then hits the runner behind him.",["Play on, runner not out","Runner out"],0,"If the ball passed an infielder, the runner is not out."],["The runner from first slides hard into second way off the base to take out the second baseman.",["Interference: double play can be called","Clean slide, play on"],0,"Sliding at the fielder instead of the base is interference."],["A spectator reaches over the fence and touches a fly ball the right fielder was about to catch.",["Ump can call the batter out","It's a home run","Do over"],0,"Fan interference: the ump calls what would have happened."],["A thrown ball goes into the dugout.",["Dead ball, runners get two bases","Play on","Runners go back"],0,"Throws out of play give runners two bases."],["A pitch goes into the dugout with a runner on first.",["Runner gets one base","Runner gets two bases","Nothing"],0,"A pitch out of play is one base."],["The batter is called out on strikes, but the catcher missed it and it rolls to the backstop. Two outs, runner on first.",["Batter can run","Batter is out"],0,"With two outs he can run on a dropped third strike even with first taken."],["A pop-up is hit with runners on first and second and one out. The ump calls infield fly. The ball lands foul and nobody touches it.",["Foul ball","Batter out"],0,"If an infield fly lands foul untouched, it's just a foul ball."],["Runners on first and second, nobody out. A line drive is hit to the shortstop. The ump doesn't call infield fly.",["Correct, line drives aren't infield flies","Wrong call"],0,"The infield fly rule is for pop-ups, not line drives or bunts."],["Runner on second, one out. A pop-up in the infield. Does the infield fly rule apply?",["No","Yes"],0,"It needs a force at third: runners on first and second, or bases loaded."],["A bunt is popped up with runners on first and second and nobody out.",["No infield fly","Infield fly, batter out"],0,"Bunted pop-ups aren't infield flies."],["The pitcher steps off the back of the rubber and throws to second on a pickoff.",["Legal","Balk"],0,"Off the rubber he's an infielder. Throw anywhere."],["The pitcher, on the rubber with a runner on, drops the ball by accident.",["Balk","No call"],0,"Dropping the ball while on the rubber with runners on is a balk."],["The pitcher, on the rubber with nobody on, drops the ball by accident.",["No call","Balk"],0,"With nobody on there's no balk. Pick it up."],["The pitcher comes set and goes home without stopping. Runner on first.",["Balk","Legal"],0,"From the stretch, he has to come to a full stop with runners on."],["The catcher's mitt touches the bat while the batter is swinging.",["Catcher's interference, batter gets first","Strike","Foul ball"],0,"The batter gets first base on catcher's interference."],["The batter steps across home plate while the catcher is trying to throw out a runner stealing.",["Batter interference, runner out","Play on"],0,"The batter can't get in the catcher's way on a throw."],["The ball hits the umpire after it passes the infielders.",["Play on","Dead ball"],0,"Once it's past an infielder, the umpire is just part of the field."],["Runner on second. A fair ball bounces once and goes over the fence.",["Runner scores, batter to second","Batter and runner score"],0,"Ground-rule double: everyone gets two bases from where they were when it was hit."],["The batter hits a fly ball over the fence, and the left fielder reaches over and catches it.",["Out","Home run"],0,"If he catches it, it's an out, even reaching over the fence."],["The left fielder catches a fly ball and his momentum carries him over the fence. He holds it.",["Out, runners move up one base","Home run","Do over"],0,"It's a catch, but runners get a base when he leaves the field."],["Batter-runner runs to first inside the line on a bunt and gets hit by the throw.",["Out, interference","Safe"],0,"He has to run in the running lane on the last half of the way to first."],["The runner on second watches the shortstop catch a line drive and doesn't move. The shortstop steps on second.",["No out, the runner never left","Out"],0,"He was standing on the base. Only runners off the base can be doubled off."],["The batter hits a fly ball that the ump calls an infield fly. A runner tries to advance and is tagged off the base.",["Runner is out too","Runner is safe"],0,"The ball is live on an infield fly. Runners can run at their own risk."],["The pitcher throws the pitch and it bounces before home plate, then crosses through the zone.",["Ball","Strike"],0,"A pitch that bounces first can't be a called strike."],["The batter swings at a pitch that bounces before the plate and misses.",["Strike","Ball"],0,"Swinging at it makes it a strike."],["The batter swings at strike three, which bounced in the dirt. The catcher catches it on the bounce. First base is open.",["Batter can run","Batter is out"],0,"Caught on a bounce counts as dropped. He can run."],["The runner from first misses second base on his way to third. The defense steps on second and appeals before the next pitch.",["Out","Safe"],0,"Missing a base and getting appealed is an out."],["A runner touches home plate with his hand on a slide before the catcher's tag reaches him.",["Safe","Out"],0,"He beat the tag."],["Runners on second and third. The batter hits a ground ball and the runner from second runs into the third baseman fielding it.",["Runner out, interference","Play on"],0,"A runner has to avoid a fielder making a play on the ball."],["The fielder is in the baseline, not fielding the ball, and trips the runner.",["Obstruction, runner awarded a base","Runner out","Play on"],0,"Fielders without the ball can't block or trip runners."],["The ball is thrown into the stands while the runner is between first and second. He had passed first when the throw was made.",["Third base","Second base","Home"],0,"Two bases from where he was when the ball was thrown. He was past first, so he gets third."],["The batter is hit by a pitch but it was ball four anyway.",["He goes to first","He's out","Do over"],0,"Either way he gets first base."],["Bottom of the last inning, tie game, bases loaded. Walk-off walk. The runner from third touches home but the batter never runs to first.",["Batter must touch first for the run to count","Run counts no matter what"],0,"The runner from third and the batter both have to touch their next bases."],["The batter hits a ball and the bat breaks. The barrel flies toward the shortstop who has to dodge it, and the ball goes through.",["Play on","Dead ball","Batter out"],0,"A broken bat isn't interference. Play on."],["Runner on first. Ground ball to short. The second baseman catches the throw at second but his foot is a foot away from the bag.",["Safe","Out"],0,"On a force he has to touch the base with the ball."],["The catcher blocks the plate without the ball while the runner is coming home.",["Safe, obstruction","Out"],0,"Without the ball, the catcher has to give the runner a path to the plate."],["A fly ball is caught for the third out, but a runner crossed home before the catch.",["Run doesn't count","Run counts"],0,"The batter was out before reaching first, so no run can score."],["The batter hits a ground ball that hits the pitcher's rubber and bounces into foul ground before first base.",["Foul","Fair"],0,"Before first or third, it's where the ball ends up or is touched."],["A runner steals second. The throw is late, and he slides in head-first and touches the bag with his hand.",["Safe","Out"],0,"He beat the throw. Safe (check your league's head-first sliding rule)."],["The batter takes strike three right down the middle.",["Out","Ball","Do over"],0,"Strike three looking is still strike three."],["Runner on first, nobody out. Line drive to the second baseman who catches it and tags the runner off the base.",["Double play","One out only"],0,"Catch for one, tag the runner off the base for two."]]);
QZ.rbook.push(...[["How many pitches a day can an 11 or 12-year-old throw under Pitch Smart?",["85","100","60","120"],"Pitch Smart says 85 pitches a day max for ages 11 and 12."],["Under Pitch Smart, a 12-year-old throws 25 pitches. How many days of rest?",["1","0","2","3"],"21 to 35 pitches means 1 day of rest."],["Under Pitch Smart, a 12-year-old throws 40 pitches. How many days of rest?",["2","1","3","4"],"36 to 50 pitches means 2 days of rest."],["Under Pitch Smart, a 12-year-old throws 55 pitches. How many days of rest?",["3","2","4","1"],"51 to 65 pitches means 3 days of rest."],["Under Pitch Smart, a 12-year-old throws 15 pitches. How many days of rest?",["0","1","2","3"],"1 to 20 pitches: he can pitch again the next day."],["Should a 12U player pitch and catch in the same game?",["Pitch Smart says no","It's fine every game","Only in the playoffs","Only if he's tired"],"Catching and pitching together is a lot of throwing. Pitch Smart says avoid it."],["How many months a year should a 12U pitcher take off from throwing?",["At least 4 months","None","1 week","2 weeks"],"Pitch Smart says at least four months off from overhand throwing each year, with two or three in a row."],["In most 12U travel ball, can the pitcher re-enter the game as a pitcher after leaving the mound?",["Usually no","Always yes","Only if he's the catcher","Only in extra innings"],"In most tournaments, once a pitcher is removed from the mound he can't pitch again that game."],["How long is the time limit for many 12U tournament pool games?",["About 1 hour 30 minutes to 1 hour 45 minutes","15 minutes","3 hours","No limit"],"Most tournaments use a time limit. No new inning starts after time runs out."],["What's the run rule in many 12U tournaments?",["15 after 3 innings, 10 after 4, 8 after 5","1 run","20 after 1 inning","There is no run rule"],"Ask your tournament, but 15-10-8 is very common."],["A 12U player throws his helmet after striking out. What usually happens?",["Warning or ejection depending on the league","Nothing","He gets another strike","His team loses a run"],"Throwing equipment is unsportsmanlike. Umps can warn or eject."],["Does a base runner have to wear a helmet?",["Yes, always","Only at home plate","Only with two outs","No"],"Batters, runners, and base coaches who are players must wear helmets."],["Does the on-deck batter have to wear a helmet?",["Yes","No","Only in the playoffs","Only if he's swinging"],"Anyone near the field swinging a bat needs a helmet."],["Can a 12U catcher catch without a cup and full gear?",["No, full gear is required","Yes","Only in practice games","Only if he's fast"],"Catchers need mask, helmet, chest protector, shin guards and protection."],["Can a player wear a metal-spiked cleat in most 12U leagues?",["Depends on the league. Many youth leagues ban metal spikes","Always yes","Always no, even in high school","Only the pitcher"],"Check your league. Many 12U leagues allow only molded cleats."],["In most 12U travel ball, can a runner steal home on a passed ball?",["Yes","No","Only with two outs","Only in the last inning"],"12U travel ball allows stealing home."],["In Little League Majors (12U), can a runner leave the base before the pitch reaches the batter?",["No","Yes","Only to steal home","Only with two strikes"],"Little League Majors doesn't allow leadoffs. Travel 12U usually does."],["What does a courtesy runner have to be in most 12U tournaments?",["A player not currently in the game, or the last batted out","Anyone in the stands","The coach","The fastest kid, even if he's in the game"],"Rules vary. Many use a player not in the lineup, or the last recorded out."],["What's a 'free substitution' in most 12U travel ball?",["Players can come in and out of the field freely when the team bats everyone","Subs cost money","Only one sub per game","Subs can't come back"],"With a continuous batting order, defensive subs are usually free."],["In a continuous batting order, a player gets hurt and can't bat. What usually happens?",["His spot is skipped with no out, depending on the rules","Automatic out","His team forfeits","The coach bats"],"Most tournaments skip the injured player's spot. Some call it an out. Check your rules."],["A player leaves early for another event. Under many continuous-batting-order rules, what happens when his spot comes up?",["It's an out","It's skipped","The coach bats","The game ends"],"Many leagues count an out if a player leaves without injury."],["The umpire says 'time.' Can the runner keep running?",["No, the ball is dead","Yes","Only to the next base","Only on a home run"],"When time is called, play stops."],["Can a coach argue a balls-and-strikes call?",["No, judgment calls can't be argued","Yes, any time","Only with two strikes","Only in the last inning"],"Coaches can ask about rules, not argue judgment calls."],["Can a coach ask the umpire to check with the base umpire on a checked swing?",["Yes, the catcher or coach can ask for an appeal","No, never","Only the batter can","Only in the World Series"],"On a called ball, the defense can ask the plate ump to check with the base ump."],["What does the ump signal with both arms out to the side?",["Safe","Out","Foul","Strike"],"Arms spread wide is safe."],["What does the ump signal with a fist punch?",["Out or strike","Safe","Ball","Time out"],"A fist means out, or a strike behind the plate."],["What does the ump do when there's a balk?",["Points at the pitcher and yells 'balk'","Waves his arms","Says nothing","Throws a flag"],"He points at the pitcher and calls it."],["How many mound visits can a 12U coach usually make in an inning before the pitcher has to come out?",["Usually 2 in an inning, or 3 in a game","10","Unlimited","0"],"Many rules: second visit in an inning or third in a game, the pitcher is removed from the mound."],["The catcher goes to the mound to talk to the pitcher. Does it count as a coach visit?",["Usually no","Yes, always","Only the first one","Only with runners on"],"Most youth rules don't count player visits, but don't stall."],["What's the pitcher's 'set position'?",["Facing the batter from the stretch with hands together, stopped","Winding up","Sitting down","Throwing to first"],"From the set, he has to stop before pitching with runners on."],["Can a pitcher wear a white or gray sleeve under his jersey in most leagues?",["Usually no, it can distract the batter","Always yes","Only in night games","Only lefties"],"Umps can ask a pitcher to remove distracting sleeves or wristbands."],["Can a pitcher wipe the ball on his pants while on the rubber?",["He should step off first","Yes, on the rubber is fine","Only the catcher can","Only after a strikeout"],"Going to the mouth or the uniform while on the rubber can be called."],["Can a pitcher go to his mouth while standing on the mound?",["Not while touching the rubber","Always","Only with runners on","Only in the first inning"],"He has to step off the rubber or wipe it off first."],["A pitcher hits three batters in one game. What can happen in many youth leagues?",["He may have to be removed from the mound","Nothing","He gets a free strike","The other team loses a run"],"Some leagues require removing a pitcher who hits too many batters."],["What's the 'dropped third strike' rule in Little League Majors?",["It's not used","Same as MLB","Only with two outs","Only for the catcher"],"Little League Majors doesn't use it. Most 12U travel ball does."],["Is bunting allowed in 12U travel ball?",["Yes","No","Only in the last inning","Only for the pitcher"],"Bunting is legal at 12U."],["Can a runner slide into first base?",["Yes, but running through is usually faster","No, it's illegal","Only head-first","Only on a bunt"],"It's legal, but running through the bag is almost always faster."],["Can a runner fake a slide to throw off the fielder?",["Yes, as long as he doesn't make contact on purpose","No, never","Only at home","Only in the playoffs"],"Fake slides are fine. Contact on purpose isn't."],["What's an 'obstruction' call?",["A fielder without the ball blocks a runner","A runner blocks a fielder","A batter throws his bat","A pitch hits the batter"],"Obstruction is on the defense. The runner usually gets the base he would've reached."],["What's an 'interference' call on a runner?",["The runner gets in the way of a fielder making a play","A fielder blocks the runner","The pitcher balks","The catcher drops the ball"],"Interference is on the offense. The runner is usually out."],["A coach in the third-base box runs toward home to draw a throw.",["The runner can be called out","It's legal","The batter is out","The coach gets a point"],"Coaches can't act like runners to draw throws."],["Can a player use a bat that has tape on the barrel?",["Usually no","Yes, as much as he wants","Only on wood bats","Only in practice"],"Tape on the barrel isn't allowed. The grip area is fine."],["Your team bats out of order, and the other team doesn't say anything until after the next pitch. What happens?",["The play stands. The next batter is whoever follows the batter who just hit","The batter is out","Everyone goes back","The game ends"],"Once a pitch is thrown to the next batter, the improper at-bat becomes legal."],["How far is the pitching rubber from home plate on a 12U field?",["50 feet","46 feet","54 feet","60 feet 6 inches"],"Most 12U travel fields use 50 feet."],["How far apart are the bases on a 12U travel field?",["70 feet","60 feet","80 feet","90 feet"],"70 feet is the 12U standard in most travel ball."],["How far apart are the bases in Little League Majors?",["60 feet","70 feet","80 feet","90 feet"],"Little League Majors plays on 60-foot bases with a 46-foot mound."],["Which part of the bat must be no bigger than 2 5/8 inches for most 12U USSSA bats?",["The barrel","The handle","The knob","The end cap"],"Most 12U USSSA bats have a 2 5/8 inch barrel or smaller."],["What does 'drop' mean on a bat, like -10?",["Length minus weight in ounces","How far it drops when swung","How many times it's been dropped","Barrel size"],"A 30-inch, 20-ounce bat is a drop 10."],["A player swings and the bat slips out of his hands and hits a fielder.",["Usually a warning, then possible out","Home run","Nothing ever","The fielder is out"],"Most leagues warn first. Grip the bat and use batting gloves."],["Can a player wear a hat instead of a helmet on defense?",["Yes, except catchers","No, everyone wears helmets","Only outfielders wear hats","Only the pitcher can"],"Fielders can wear caps. Catchers need a helmet and mask."],["Your team is tied after regulation in a 12U tournament game. What often happens?",["International tiebreaker with a runner on second","Coin flip","The game is a tie forever","Home run derby"],"Many tournaments start extra innings with a runner on second."],["Can a pitcher use a rosin bag?",["Yes","No","Only in the playoffs","Only the catcher"],"Rosin helps the grip and is legal. It can't go on the glove or uniform."],["What happens if a pitcher takes too long between pitches with nobody on?",["The ump can call a ball","Nothing","The batter is out","Strike"],"Youth rules often give 20 seconds with nobody on."],["Can the batter step out of the box any time he wants?",["Only if the ump grants time","Yes, whenever","Only after strikes","Only with two outs"],"He has to ask the ump for time."],["The batter's back foot is on the line of the batter's box. Is he legal?",["Yes, the line is part of the box","No, he's out","Only for lefties","Only with two strikes"],"The line counts as inside the box."],["What's a 'mercy rule'?",["The game ends early when one team is way ahead","Pitchers get a break","Kids get a free walk","The coach can pitch"],"Same as a run rule. It ends lopsided games."],["Can a coach be on the field during a live ball?",["Only in the coach's boxes","Yes, anywhere","Only in the outfield","Only near the mound"],"Coaches have to stay in their boxes during play."],["A runner on third leaves early on a caught fly ball. How does the defense get the out?",["Throw to third and appeal before the next pitch","Tag home plate","Tell the coach","Nothing, it's automatic"],"The defense has to appeal. It isn't automatic."],["Can a pitcher pitch from the windup with a runner on first?",["Yes, but it's slower and lets him steal","No, it's illegal","Only lefties","Only with two outs"],"It's legal, but the stretch is quicker."],["In most 12U travel ball, is a pitcher allowed to throw curveballs?",["Usually legal, but Pitch Smart says wait until you have a good fastball and changeup","Banned everywhere","Required","Only in the playoffs"],"Most rules allow it, but focus on fastball command and a changeup first."],["What's a 'legal catch'?",["The fielder has secure control of the ball in the glove or hand","Any touch","Trapping it on the ground","Catching it in your hat"],"Using a cap or anything but your glove or hand is illegal."],["A fielder catches the ball in his cap.",["Runners get three bases","It's an out","It's a strike","Nothing"],"Using a cap or detached equipment on a batted ball gives the runners three bases."],["A fielder throws his glove at a batted ball and hits it.",["Runners get three bases","It's an out","It's a foul","Nothing"],"Throwing your glove at a fair batted ball gives three bases."],["When a pitcher starts his pitch, where must his pivot foot be?",["It must touch the rubber when the pitch starts","It must be off the rubber","It must point at first","It doesn't matter"],"The pivot foot touches the rubber to start the pitch."],["Can a team play with only 8 players in most 12U tournaments?",["Often yes, with an out for the empty spot","No, they forfeit","Yes, and no outs","Only with 7"],"Many tournaments let you play with 8, taking an out in the ninth spot."],["Before a pitch, the catcher sets up on the outside corner. Where should the pitcher throw?",["At the catcher's glove","Down the middle","Wherever he wants"],"Hit the target. The catcher sets up where the pitch should go."],["A 12U player gets ejected. What usually happens next game?",["He often has to sit out the next game","Nothing","He has to pitch","He bats leadoff"],"Many tournaments suspend ejected players for the next game. Check your rules."]]);

lder.","I'm known as maybe the fastest player ever."]],["Whitey Ford","They called me The Chairman of the Board.",["I won 10 World Series games, the most ever.","I was a lefty starter.","I pitched my whole career for the New York Yankees."]],["Roger Maris","I won back-to-back MVPs in 1960 and 1961.",["I played in the outfield next to Mickey Mantle.","I broke Babe Ruth's single-season record.","I hit 61 home runs in 1961."]],["Christy Mathewson","I threw three shutouts in the 1905 World Series.",["I won 373 games.","I pitched for the New York Giants.","I was one of the first five players in the Hall of Fame."]],["Dave Winfield","I was drafted in baseball, basketball and football.",["I went straight to the majors without playing in the minors.","I had 3,110 hits.","I started with San Diego and later played for the Yankees."]],["Hideo Nomo","I had a twisting 'tornado' windup.",["I threw no-hitters in both leagues.","I was the 1995 National League Rookie of the Year.","I left Japan to pitch for the Dodgers."]],["Yadier Molina","My two older brothers were big-league catchers too.",["I won nine Gold Gloves.","I won two World Series.","I caught for the St. Louis Cardinals for 19 years."]],["Adrián Beltré","I hated when teammates touched my head.",["I had 3,166 hits.","I played third base and won five Gold Gloves.","I'm a Texas Rangers Hall of Famer."]],["Bryce Harper","I was on the cover of Sports Illustrated at 16.",["I won the 2015 MVP at age 22.","I started my career with the Washington Nationals.","I play for the Philadelphia Phillies."]],["Tim Lincecum","They called me The Freak.",["I won two Cy Young Awards in a row, in 2008 and 2009.","I was small for a pitcher, about 5 feet 11.","I pitched for the San Francisco Giants."]],["Madison Bumgarner","I threw five scoreless innings of relief in Game 7 of the 2014 World Series.",["I was the 2014 World Series MVP.","I'm a big lefty from North Carolina.","I won three World Series with the Giants."]],["Rogers Hornsby","I hit . /* --- XP to spend: every XP a player earns also goes into a spendable balance. Level XP never goes down. --- */
const ECON={freeDrills:8,freeGames:10,welcome:1};
function coinDay(p){const t=today();if(!p.earn||p.earn.d!==t)p.earn={d:t,free:0,games:0,coins:0};return p.earn}
function econ(p){if(!p||p.tmp)return p;if(p.bank==null){p.bank=Math.max(0,p.coins||0);p.freePacks=(p.freePacks||0)+ECON.welcome;delete p.coins}return p}
function award(p,xp,msg){econ(p);const before=level(p.xp).i;p.act=p.act||{};p.act[today()]=(p.act[today()]||0)+1;p.xp+=xp;touch(p);
  let c=0;if(!p.tmp){const e=coinDay(p);if(msg==="Homework done!"||msg==="Film study!")c=xp;else if(msg==="Nice work!"){if(e.free<ECON.freeDrills){c=xp;e.free++}}else{if(e.games<ECON.freeGames){c=xp;e.games++}}p.bank=(p.bank||0)+c;e.coins+=c}
  let pack=false;if(!p.tmp&&msg==="Homework done!"){const t=today(),left=p.hw.filter(h=>!h.done&&(!h.on||h.on<=t));if(!left.length&&p.hw.some(h=>h.done===t)&&p.dayPack!==t){p.dayPack=t;p.freePacks=(p.freePacks||0)+1;pack=true}}
  checkBadges(p);save();burst();toast((msg?msg+" ":"")+"+"+xp+" XP"+(c&&c<xp?" ("+c+" to spend)":""));if(pack)setTimeout(()=>toast("🎁 All of today's work is done! Free Rookie Pack in Cards"),1700);if(level(p.xp).i>before)setTimeout(()=>toast("⬆️ Level up: "+level(p.xp).n+"!"),pack?3400:1600)}
function mergeInbox(p,items){let ch=false;p.got=p.got||{};const live={};econ(p);(items||[]).forEach(it=>{live[it.aid]=1;if(it.kind==="unhw"&&(it.keys||[]).length&&!it.all&&!it.done)unhwApply(p,it);if(p.got[it.aid])return;p.got[it.aid]=1;ch=true;
  if(it.kind==="shout")p.shouts.push({t:it.t,at:it.at,aid:it.aid});else if(it.kind==="unhw")unhwApply(p,it);else if(it.kind==="cheer"&&it.sp)spApply(p,it.sp,it.from);else if(it.kind==="cheer")p.shouts.push({t:it.t,at:it.at,aid:it.aid,from:it.from});
  else if(it.kind==="coins"){const n=Math.max(0,Math.min(5000,+it.n||0));p.xp+=n;if(!p.tmp)p.bank=(p.bank||0)+n;p.shouts.push({t:"⚡ +"+n+" XP · "+(it.t||"Coach bonus"),at:it.at||today(),aid:it.aid})}
  else if(it.kind==="plog")(p.pitch=p.pitch||[]).push({d:it.d,n:+it.n||0,what:it.what,from:it.from,aid:it.aid});else if(it.kind==="pain")p.pain={at:it.at,note:it.note||"",from:it.from,aid:it.aid};else if(it.kind==="painok"){if(p.pain&&p.pain.aid===it.ref)delete p.pain}else if(it.kind==="pitch")p.pitch.push({d:it.d,n:it.n,aid:it.aid});else if(it.hw&&DRok(it.hw.id))p.hw.push(Object.assign({},it.hw,{aid:it.aid}))});
  Object.keys(p.got).forEach(k=>{if(!live[k])delete p.got[k]});return ch}

const RAR={C:["Common","#AEB6C4","Steel"],R:["Rare","#4DB8FF","Sapphire"],A:["All-Star","#B57BFF","Amethyst"],S:["Superstar","#FFD25A","Gold Prism"],L:["Legend","#FF5FA2","Cosmic"]};

 {k:"rookie",n:"Rookie Rush",cost:250,cards:4,sub:"4 cards · anything can drop",c:"#22D3EE",c2:"#2563EB",slots:["n","n","n","n"],auto:.015,pm:1.2},

 {k:"hof",n:"Hall of Fame Vault",cost:2000,cards:5,sub:"5 cards · 1 Superstar or Legend guaranteed",c:"#FCD34D",c2:"#0B0B0D",slots:["r","r","r","r","big"],auto:.09,pm:3,par:1}];
const SLOTW={n:{C:55,R:32,A:10,S:2.5,L:.5},hit:{R:66,A:25,S:7.5,L:1.5},r:{R:70,A:23,S:5.5,L:1.5},big:{S:78,L:22}};
const PARW={base:880,purple:70,gold:30,orange:14,red:5,black:1};
const SELL={C:10,R:30,A:80,S:200,L:500},PMULT={base:1,purple:1.5,gold:2,orange:3,red:5,black:10};
function wpick(w){const ks=Object.keys(w),t=ks.reduce((a,k)=>a+w[k],0);let r=Math.random()*t;for(const k of ks){if((r-=w[k])<0)return k}return ks[ks.length-1]}
function rollPar(pm){const w=Object.assign({},PARW);Object.keys(w).forEach(k=>{if(k!=="base")w[k]*=pm});return wpick(w)}
function makeCard(p,r,par,auto){const pool=CARDS.filter(c=>c.r===r),c=pool[Math.floor(Math.random()*pool.length)];
  if(par==="black"&&(p.cards||[]).some(x=>x.id===c.id&&x.par==="black"))par="red";const run=PAR[par][2]||(auto?99:0);
  return{u:nid().slice(0,12),id:c.id,par,auto:!!auto,sn:run?(1+Math.floor(Math.random()*run))+"/"+run:"",at:today()}}
function openPack(p,pk){const out=pk.slots.map(s=>makeCard(p,wpick(SLOTW[s]),rollPar(pk.pm),Math.random()<pk.auto));
  if(pk.par&&!out.some(c=>c.par!=="base")){const i=Math.floor(Math.random()*out.length);out[i].par=wpick({purple:60,gold:25,orange:10,red:4.5,black:.5});const run=PAR[out[i].par][2];out[i].sn=(1+Math.floor(Math.random()*run))+"/"+run}
  return out.sort((a,b)=>rank(a)-rank(b))}
const covr=c=>{const b=CARD[c.id];return b?Math.min(99,b.ovr+PAR[c.par][1]+(c.auto?2:0)):0};
const cval=c=>{const b=CARD[c.id];return b?Math.min(2000,Math.round(SELL[b.r]*PMULT[c.par]*(c.auto?2:1))):0};
const rank=c=>"CRASL".indexOf(CARD[c.id].r)*10+Object.keys(PAR).indexOf(c.par)+(c.auto?6:0);
const isBig=c=>{const b=CARD[c.id];return b.r==="S"||b.r==="L"||c.auto||c.par==="red"||c.par==="black"};
const oddsPct=(w,k)=>{const t=Object.values(w).reduce((a,b)=>a+b,0);return w[k]/t};
function packOdds(pk){const per={};Object.keys(RAR).forEach(r=>{let none=1;pk.slots.forEach(s=>{none*=1-(SLOTW[s][r]?oddsPct(SLOTW[s],r):0)});per[r]=1-none});return per}
const fmtOdds=p=>p>=.5?Math.round(p*100)+"%":p<=0?"—":"1 in "+Math.max(1,Math.round(1/p)).toLocaleString("en-US");
const xpfmt=n=>n===Infinity?"Unlimited":(n||0).toLocaleString("en-US");

(function(){let cur=null;const off=el=>{el.classList.remove("tilt");["--rx","--ry","--mx","--my"].forEach(k=>el.style.removeProperty(k))};
  const mv=e=>{const el=e.target&&e.target.closest?e.target.closest(".tc"):null;if(cur&&cur!==el){off(cur);cur=null}if(!el)return;const r=el.getBoundingClientRect();if(!r.width)return;const x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height)),m=el.classList.contains("big")?18:10;
    el.classList.add("tilt");el.style.setProperty("--ry",((x-.5)*m).toFixed(2)+"deg");el.style.setProperty("--rx",((.5-y)*m).toFixed(2)+"deg");el.style.setProperty("--mx",(x*100).toFixed(1)+"%");el.style.setProperty("--my",(y*100).toFixed(1)+"%");cur=el};
  document.addEventListener("pointermove",mv,{passive:true});document.addEventListener("pointerdown",mv,{passive:true});
  ["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,e=>{if(cur&&e.pointerType!=="mouse"){off(cur);cur=null}},{passive:true}));
  document.addEventListener("pointerout",e=>{if(cur&&!(e.relatedTarget&&cur.contains(e.relatedTarget))&&e.target.closest&&e.target.closest(".tc")===cur){off(cur);cur=null}},{passive:true})})();

function pkRender(){let o=$("#pko");if(!PK){if(o)o.remove();document.body.classList.remove("lock");return}if(!o){o=document.createElement("div");o.id="pko";document.body.appendChild(o)}document.body.classList.add("lock");
  const pk=PK.pk||PACKS[0],best=PK.cards.reduce((m,c)=>Math.max(m,"CRASL".indexOf(CARD[c.id].r)),0),bc=RAR["CRASL"[best]][1];let h="";
  if(PK.phase==="pack"||PK.phase==="rip")h=`<div class="pkstage ${PK.phase}" style="--glow:${bc}"><div class="pkrays"></div><button class="pkhold" data-a="xrip" aria-label="Rip open the pack">${packArt(pk,1)}</button><p class="pkhint">${PK.phase==="pack"?"Tap the pack to rip it open":""}</p><div class="pkflash"></div></div>`;
  else if(PK.phase==="walk"){const c=PK.cards[PK.wo],b=CARD[c.id],T=TEAMS[b.tm]||["","#333","#999"],R=RAR[b.r];
    h=`<div class="walk st${PK.st}" style="--t1:${T[1]};--t2:${T[2]};--rc:${R[1]}" data-a="xwalk"><div class="wbeams"></div><div class="wflood"></div>
     <div class="wstep w1"><small>${b.leg?"LEGENDS":"DUGOUT '26"}</small><b>${esc(T[0])}</b></div><div class="wstep w2"><b>${b.pos}${b.tw?" · SP":""}</b><small>${R[0]}${c.par!=="base"?" · "+PAR[c.par][0]:""}${c.auto?" · AUTO":""}</small></div>
     <div class="wstep w3"><b id="wovr">${PK.st>=3?covr(c):""}</b></div><div class="wcard">${PK.st>=4?tcard(c,1):""}</div><p class="whint">${PK.st>=4?"Tap to keep going":""}</p><div class="pkflash"></div></div>`}
  else{const all=PK.open.every(Boolean);
    h=`<div class="pkdeal"><h2>${esc(PK.name)}</h2><p>${all?"Here's what you pulled":"Tap a card to reveal it"}</p><div class="pkrow">${PK.cards.map((c,i)=>PK.open[i]?`<div class="pkc in">${tcard(c)}</div>`:`<button class="pkc back r${CARD[c.id].r} ${isBig(c)?"big":""}" style="--rc:${RAR[CARD[c.id].r][1]};--d:${i*.12}s" data-a="xflip:${i}" aria-label="Reveal card ${i+1}"><span class="pkcb"><b>🐾</b><i>'26</i></span></button>`).join("")}</div>
     <div class="pkbtns">${all?`<button class="cta" data-a="xpdone">Add to my binder</button>`:`<button class="ghost" data-a="xflipall">Reveal all</button>`}</div></div>`}
  o.innerHTML=h}
function pkFlip(i){if(!PK||PK.open[i])return;const c=PK.cards[i];if(isBig(c)){PK.phase="walk";PK.wo=i;PK.st=0;pkRender();[1,2,3,4].forEach((s,k)=>setTimeout(()=>{if(PK&&PK.phase==="walk"&&PK.wo===i){PK.st=s;pkRender();if(s===3)pkCount(covr(c));if(s===4)burst()}},[350,1300,2300,3400][k]))}else{PK.open[i]=true;pkRender()}}

document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||e.target.closest("a"))return;const a=t.dataset.a.split(":"),k=a[0],v=a[1];if(k[0]!=="x")return;const p=cardOwner();if(isCoach()&&/^x(buy|daily|free|flip|pdone|sell|add|put|best|walk)/.test(k))setTimeout(saveCoachCards,0);
  if(k==="xvclose"){sheet=sheet&&sheet[0]==="vid"?sheet[3]||null:null;render();return}
  if(k==="xct2"){window._ct2=v;render();return}if(k==="xbf"){window._bf=v;render();return}
  if(k==="xodds"){sheet=["odds"];render();return}
  if(k==="xbuy"){const pk=PACKS.find(x=>x.k===v);if(!p||!pk||(!unl()&&(p.bank||0)<pk.cost))return;if(!unl())p.bank-=pk.cost;p.opened=(p.opened||0)+1;const cs=openPack(p,pk);(p.cards=p.cards||[]).push(...cs);save();pkStart(pk.n,pk,cs);return}
  if(k==="xfree"){if(!p||!(p.freePacks>0))return;p.freePacks--;const pk=PACKS[0],cs=openPack(p,pk);(p.cards=p.cards||[]).push(...cs);save();pkStart("Free "+pk.n,pk,cs);return}
  if(k==="xdaily"){if(!p||!unl()&&(p.daily===today()||!(p.act||{})[today()]))return;if(!unl())p.daily=today();const c=makeCard(p,wpick(SLOTW.n),rollPar(1.2),Math.random()<.015);(p.cards=p.cards||[]).push(c);save();pkStart("Daily Dugout Pull",{k:"rookie",n:"Daily Pull",cards:1,c:"#3DDC84",c2:"#0E5A31"},[c]);return}
  if(k==="xrip"){if(!PK||PK.phase!=="pack")return;PK.phase="rip";pkRender();setTimeout(()=>{if(PK){PK.phase="deal";pkRender()}},1100);return}
  if(k==="xflip"){pkFlip(+v);return}
  if(k==="xwalk"){if(!PK||PK.phase!=="walk")return;if(PK.st<4){PK.st=4;pkRender();burst();return}PK.open[PK.wo]=true;PK.phase="deal";pkRender();return}
  if(k==="xflipall"){PK.cards.forEach((c,i)=>{if(!PK.open[i]&&!isBig(c))PK.open[i]=true});const bi=PK.cards.findIndex((c,i)=>!PK.open[i]);if(bi>=0)pkFlip(bi);else pkRender();return}
  if(k==="xpdone"){PK=null;pkRender();sheet=null;window._ct2="binder";window._bf="all";render();return}
  if(k==="xcard"){window._qs="";window._cf="";sheet=["card",v];render();return}
  if(k==="xcflip"){window._cf=window._cf===v?"":v;render();return}
  if(k==="xsell"){if(window._qs!==v){window._qs=v;render();return}const c=(p.cards||[]).find(x=>x.u===v);if(!c)return;if(!unl())p.bank=(p.bank||0)+cval(c);p.cards=p.cards.filter(x=>x.u!==v);Object.keys(p.squad||{}).forEach(s=>{if(p.squad[s]===v)delete p.squad[s]});save();toast("Sold for ⚡ "+cval(c)+" XP");sheet=null;render();return}
  if(k==="xadd"){const c=(p.cards||[]).find(x=>x.u===v);if(!c)return;const b=CARD[c.id];p.squad=p.squad||{};const sq=p.squad,cv=u=>{const x=p.cards.find(z=>z.u===u);return x?covr(x):0},done=m=>{save();toast(m);sheet=null;window._ct2="squad";render()};
    Object.keys(sq).forEach(x=>{const cx=p.cards.find(z=>z.u===sq[x]);if(cx&&cx.id===c.id)delete sq[x]});
    const fit=SLOTS.map(s=>s[0]).filter(s=>canPlay(b,s)),open=fit.find(s=>!sq[s]);if(open){sq[open]=v;done(b.n+" is your "+open);return}
    const w=fit.slice().sort((x,y)=>cv(sq[x])-cv(sq[y]))[0],ob=BENCH.find(x=>!sq[x]);
    if(w&&cv(sq[w])<covr(c)){const old=sq[w];sq[w]=v;if(ob)sq[ob]=old;done(b.n+" is your "+w+(ob?". Old starter moved to the bench":""));return}
    if(ob){sq[ob]=v;done(b.n+" is on your bench");return}toast("Squad is full. Tap a spot to swap someone out.");return}
  if(k==="xslot"){sheet=["slot",v];render();return}
  if(k==="xput"){p.squad=p.squad||{};const u=a[2];if(u){const c=p.cards.find(z=>z.u===u);Object.keys(p.squad).forEach(x=>{const cx=p.cards.find(z=>z.u===p.squad[x]);if(cx&&cx.id===c.id)delete p.squad[x]})}if(u)p.squad[v]=u;else delete p.squad[v];save();sheet=null;render();return}
  if(k==="xbest"){p.squad=bestSquad(p);save();toast("Squad rating "+squadOVR(p));render();return}
  if(k==="xoff"){const s=window._off=(window._off||offDays()).slice(),i=s.indexOf(+v);if(i>=0)s.splice(i,1);else{s.push(+v);if(s.length>2)s.shift()}s.sort();render();return}

  if(k==="xlj"){const pin=(v||(($("#lvpin")||{}).value||"")).replace(/\D/g,"");if(pin.length!==6){LV.err="The PIN is 6 numbers.";render();return}(async()=>{try{await rpc("dz_live_join",{p_tok:TOK,p_pin:pin});LV.err="";lvGo(pin);render()}catch(err){LV.err=err.message==="no_game"?"No game with that PIN. Check Coach's screen.":nmsg(err);render()}})();return}

  if(k==="xlans"){if(!LV.st||LV.st.me&&LV.st.me.answered)return;LV.st.me=Object.assign({},LV.st.me,{answered:true,choice:+v});render();rpc("dz_live_answer",{p_tok:TOK,p_pin:LV.pin,p_qi:LV.st.idx,p_choice:+v}).catch(err=>toast(err.message==="too_late"?"Time's up!":nmsg(err)));return}
  if(k==="xlctl"){lvCtl(v);return}
  if(k==="xlend"){if(!window._le){window._le=1;render();return}window._le=0;lvCtl("end");return}
  if(k==="xlnew"){lvStop();LV.pin="";LV.st=null;render();return}});

/* --- payment plan math --- */
const FREQ={weekly:["Weekly","Every week",[4,6,8,10,12,16]],biweekly:["Every 2 weeks","Every other week",[2,3,4,6,8,10]],semimonthly:["Twice a month","On the 1st and 15th",[2,4,6,8,10,12]],monthly:["Monthly","Same day each month",[2,3,4,5,6,8]],once:["Pay in full","One payment",[1]],none:["Pay when I can","No set schedule",[]]};
function addMonths(s,k){const d=new Date(s+"T12:00:00"),day=d.getDate(),x=new Date(d.getFullYear(),d.getMonth()+k,1,12),last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return iso(x)}
function planDates(f,start,n){if(f==="once")return[start];if(f==="semimonthly"){const o=[];let d=start,g=0;while(o.length<n&&g<900){const k=+d.slice(8);if(k===1||k===15)o.push(d);d=addDays(d,1);g++}return o}
  return Array.from({length:n},(_,i)=>f==="weekly"?addDays(start,7*i):f==="biweekly"?addDays(start,14*i):addMonths(start,i))}
function schedOf(pl,total){if(!pl||pl.freq==="none"||!pl.start)return[];const base=+pl.base||0,rest=Math.max(0,total-base),ds=planDates(pl.freq,pl.start,pl.freq==="once"?1:Math.max(1,+pl.n||1)),n=ds.length,each=Math.floor(rest/n*100)/100;let cum=base;
  return ds.map((d,i)=>{const a=i===n-1?Math.round((rest-each*(n-1))*100)/100:each;cum=Math.round((cum+a)*100)/100;return{d,a,cum}})}
const sched=pid=>schedOf(planOf(pid),DUES().total);
function nextDue(pid){const T=DUES().total,paid=paidOf(pid),t=today();if(paid>=T-0.004)return{full:true};const s=sched(pid);if(!s.length)return null;
  const past=s.filter(x=>x.d<=t),owed=past.length?Math.round((past[past.length-1].cum-paid)*100)/100:0;
  if(owed>0.004){const f=s.find(x=>x.cum>paid+0.004);return{d:f.d,amt:owed,days:dd(t,f.d)}}
  const f=s.find(x=>x.cum>paid+0.004);if(f)return{d:f.d,amt:Math.round((f.cum-paid)*100)/100,days:dd(t,f.d)};
  const l=s[s.length-1];return{d:l.d,amt:Math.round((T-paid)*100)/100,days:dd(t,l.d)}}
const inDays=n=>n===0?"today":n===1?"tomorrow":n>0?"in "+n+" days":(-n)+" day"+(n===-1?"":"s")+" late";
function planName(pl){if(!pl)return"No plan yet";const f=FREQ[pl.freq];if(!f)return"";return pl.freq==="none"?f[0]:pl.freq==="once"?"Pay in full by "+nice(pl.start):f[0]+" · "+pl.n+" payments"}
function nByDue(f,start,due){if(!due||due<start)return 0;let n=0;while(n<52){const ds=planDates(f,start,n+1);if(ds[n]>due)break;n++}return n}

function demoApply(fn,a){const v=a.p_val,A=dAccts(),L=S.links,M=dMoney();
  if(fn==="dz_parent"){if(a.p_action==="plan"){if(!v||!v.freq)delete M.plans[a.p_kid];else M.plans[a.p_kid]=Object.assign({player:a.p_kid,base:paidOf(a.p_kid)},v)}if(a.p_action==="pick"&&!L.some(l=>l.parent==="m1"&&l.kid===a.p_kid))L.push({parent:"m1",kid:a.p_kid,status:"pending"});return}

    case"pay_del":M.pay=M.pay.filter(x=>x.id!==a.p_uid);break;

    case"linkok":case"link":{const l=L.find(l=>l.parent===a.p_uid&&l.kid===v);if(l)l.status="active";else L.push({parent:a.p_uid,kid:v,status:"active"});break}
    case"unlink":S.links=L.filter(l=>!(l.parent===a.p_uid&&l.kid===v));break;

    case"remove":S.accts=A.filter(x=>x.id!==a.p_uid);S.players.forEach(p=>{if(p.claimed===a.p_uid)delete p.claimed});S.links=L.filter(l=>l.parent!==a.p_uid);break;
    case"pw":break}}

/* ===== HEAD-TO-HEAD: live duels between teammates (backend: supabase/dugout-duel.sql) ===== */
const DUELG=["play","cut","rbook","rules","send","trivia","who","count","swing","steal"];
var DU={id:"",phase:"idle",st:null,poll:0,busy:false,team:null,tl:0,inv:[],recent:[],rec:null,off:false,pick:{g:"play",lv:1},err:"",oppName:"",lastP:null,left:false,cr:null,crT:0,sig:""};
const isPlayerU=()=>!isCoach()&&!isParent()&&!!me();
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function withSeed(seed,f){if(seed==null)return f();const r=Math.random;Math.random=rng(seed);try{return f()}finally{Math.random=r}}
/* both phones get the same pitches, leads and outcomes */
{const _p=swingPitch,_h=swingHit,_l=stealLead;
 swingPitch=function(){return withSeed(G&&G.seed!=null?G.seed+G.i*7919+1:null,_p)};
 swingHit=function(){return withSeed(G&&G.seed!=null?G.seed+G.i*7919+2:null,_h)};
 stealLead=function(){return withSeed(G&&G.seed!=null?G.seed+G.i*7919+3:null,_l)}}
function duProg(){if(!G)return{i:0,n:1,score:0};const k=G.k;if(k==="swing")return{i:Math.min(3,G.outs),n:3,score:G.pts};if(k==="steal")return{i:G.i,n:G.n,score:G.right};return{i:G.i,n:G.qs?G.qs.length:1,score:k==="who"?G.pts:G.right}}
const duMsg=e=>({duels_off:"Coach has Head-to-Head turned off.",slow_down:"Whoa, that's a lot of challenges. Take a break and try again soon.",bad_player:"That teammate can't be challenged.",gone:"That challenge isn't there anymore.",players_only:"Head-to-Head is for players.",not_claimed:"Pick your name on the roster first."})[e.message]||nmsg(e);

/* --- preview mode (no team server): a computer teammate plays you --- */
const SIM={d:null,recent:[],rec:{w:0,l:0,t:0}};
function simApi(fn,a){const m=me(),team=(S.players||[]).filter(p=>m&&p.id!==m.id&&!p.tmp).slice(0,12).map((p,i)=>({id:p.id,name:p.n,num:p.num,on:i%3!==2})),now=Date.now();
  if(fn==="dz_duel_team")return{off:!!S.duelsOff,me:m&&m.id,team};
  if(fn==="dz_duel_poll")return{off:!!S.duelsOff,inv:[],active:null,recent:SIM.recent,record:SIM.rec};
  if(fn==="dz_duel_invite"){if(S.duelsOff)throw new Error("duels_off");const o=team.find(t=>t.id===a.p_to);SIM.d={id:"sim"+now,game:a.p_game,lv:a.p_lv,seed:Math.floor(Math.random()*2e9),status:"invite",t0:now,oid:a.p_to,name:o?o.name:"Teammate",me:{i:0,n:0,score:0,done:false},them:{i:0,n:0,score:0,done:false},skill:.5+Math.random()*.35};return{id:SIM.d.id}}
  const d=SIM.d;if(!d||d.id!==a.p_id)throw new Error("gone");
  if(fn==="dz_duel_leave"){if(d.status==="invite")d.status="cancelled";else if(d.status==="live"&&!d.me.done){d.me.done=true;d.me.at=now;simFin()}return{ok:true}}
  if(fn==="dz_duel_tick"){if(d.status==="invite"&&now-d.t0>2500){d.status="live";d.start=now+4000;d.next=d.start+3000}
    if(d.status==="live"){if(a.p_i!=null&&now>=d.start&&!d.me.done){Object.assign(d.me,{i:a.p_i,n:a.p_n,score:a.p_score});if(a.p_done){d.me.done=true;d.me.at=now}}
      if(now>=d.start&&!d.them.done){const n=d.me.n||10;d.them.n=n;while(now>=d.next&&!d.them.done){d.them.i++;if(Math.random()<d.skill)d.them.score+=d.game==="who"?2:d.game==="swing"?1+(Math.random()<.3?1:0):1;d.next+=2400+Math.random()*3800;if(d.them.i>=n){d.them.done=true;d.them.at=now}}}
      simFin()}
    return{id:d.id,game:d.game,lv:d.lv,seed:d.seed,status:d.status,start_ms:d.start?d.start-now:null,left_ms:d.status==="invite"?120000-(now-d.t0):null,me:Object.assign({},d.me),them:Object.assign({id:d.oid,name:d.name},d.them),res:d.res||null}}
  return{ok:true}}
function simFin(){const d=SIM.d;if(d.status!=="live"||!d.me.done||!d.them.done)return;d.status="done";const m=d.me.score,t=d.them.score;d.res=m>t||(m===t&&d.me.at<d.them.at-1000)?"win":t>m||(m===t&&d.them.at<d.me.at-1000)?"loss":"tie";SIM.rec[d.res[0]]++;SIM.recent.unshift({id:d.id,game:d.game,lv:d.lv,opp:d.name,oppId:d.oid,mine:m,theirs:t,res:d.res});SIM.recent=SIM.recent.slice(0,8);const p=me();if(p)award(p,d.res==="win"?30:d.res==="tie"?20:10,"Head-to-Head")}
async function duApi(fn,a){if(NET)return rpc(fn,a);await new Promise(r=>setTimeout(r,60));return simApi(fn,a)}

async function duLoop(){if(!DU.id||DU.busy)return;const inGame=view==="game"&&G&&G.duel===DU.id;DU.busy=true;
  try{const a={p_tok:TOK,p_id:DU.id};
    if(DU.phase==="play"||DU.phase==="over"){if(inGame){DU.lastP=Object.assign(duProg(),{done:!!G.done})}else if(DU.phase==="play"&&!DU.left){DU.left=true;DU.phase="over";await duApi("dz_duel_leave",{p_tok:TOK,p_id:DU.id})}
      const p=DU.lastP||{i:0,n:0,score:0};Object.assign(a,{p_i:p.i,p_n:p.n,p_score:p.score,p_done:!!p.done||DU.left})}
    const r=await duApi("dz_duel_tick",a),prev=DU.st;DU.st=r;
    if(["declined","cancelled","expired"].includes(r.status)){const nm=DU.oppName;duReset();if(r.status!=="cancelled")toast(r.status==="declined"?(nm||"They")+" said not now.":"No answer. Try someone else.");if(view==="duel")render();return}

    if(DU.phase==="play"&&inGame){if(G.done){DU.phase="over";render()}else{const b=$("#dubar");if(b)b.outerHTML=duBar()}}
    else if(DU.phase==="over"&&inGame&&G.done&&(!prev||JSON.stringify(prev.them)!==JSON.stringify(r.them)||prev.status!==r.status))render();

/* ===== auto-update: reload when a newer version of the app is on the site ===== */
(function(){const ME_SRC=(document.currentScript||{}).textContent||"";if(!ME_SRC||location.protocol==="file:")return;
  try{if(/[?&]u=\d/.test(location.search))history.replaceState(null,"",location.pathname+location.hash)}catch(e){}
  let last=0;async function chk(){const now=Date.now();if(now-last<60000)return;last=now;
    try{const r=await fetch(location.pathname+"?c="+now,{cache:"no-store"});if(!r.ok)return;const t=await r.text();
      if(t.length<1000||t.includes(ME_SRC))return;
      let lr=0;try{lr=+sessionStorage.getItem("dz-upd")||0}catch(e){}if(now-lr<120000)return;
      try{sessionStorage.setItem("dz-upd",String(now))}catch(e){}
      location.replace(location.pathname+"?u="+now+location.hash)}catch(e){}}
  setTimeout(chk,1500);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")chk()});addEventListener("focus",chk)})();
