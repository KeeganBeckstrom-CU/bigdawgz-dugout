/* card */
.bcard{--c:var(--amber);position:relative;border-radius:22px;padding:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 55%,#4E22A6),#4E22A6 62%);border:3px solid color-mix(in srgb,var(--c) 70%,#fff);box-shadow:0 0 0 5px #3A1280,0 10px 30px rgba(0,0,0,.45)}
.bct{display:flex;justify-content:space-between;align-items:flex-start}.bnum{font:400 46px/.9 var(--fd);color:#fff;text-shadow:3px 3px 0 rgba(0,0,0,.35)}.bteam{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;background:rgba(0,0,0,.35);border-radius:999px;padding:4px 10px}
.bmid{text-align:center;margin:-6px 0 10px}.bmid .av{width:84px;height:84px}.bmid .av b{font-size:32px}.bmid h2{font-size:26px;margin-top:8px}.bpos{font-size:13px;font-weight:800;color:var(--mute)}
.blv{background:rgba(0,0,0,.3);border-radius:14px;padding:10px 12px}.blv b{font:400 15px var(--fd);color:var(--amber)}.blv .xp{margin-top:6px}.blv small{font-size:12px;color:var(--mute)}
.bst{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.bst div{text-align:center;background:rgba(0,0,0,.3);border-radius:12px;padding:8px 2px}.bst b{display:block;font:400 20px var(--fd)}.bst small{font-size:10.5px;font-weight:800;color:var(--mute);text-transform:uppercase}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bdg{text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 4px;opacity:.42;filter:grayscale(1)}.bdg.on{opacity:1;filter:none;border-color:var(--amber);background:linear-gradient(160deg,rgba(255,197,61,.2),var(--card))}.bdg span{font-size:30px}.bdg b{display:block;font-size:12.5px;font-weight:900}.bdg small{font-size:10.5px;color:var(--mute);line-height:1.2;display:block}
.skills{display:flex;flex-direction:column;gap:7px}.sk{--c:#fff;display:grid;grid-template-columns:128px 1fr 26px;align-items:center;gap:8px;font-size:13.5px;font-weight:800}.sk .xp{margin:0}.sk .xp i{background:var(--c)}.sk b{text-align:right}.when{color:var(--mute);font-size:12px;white-space:nowrap}
/* coach */
.tname{display:flex;gap:8px;align-items:flex-end}.tname input{flex:1;font:400 18px var(--fd)}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tiles div{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px;text-align:center}.tiles b{display:block;font:400 24px var(--fd);color:var(--amber)}.tiles small{font-size:11.5px;font-weight:800;color:var(--mute);text-transform:uppercase}
.prow{--c:#fff;display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:16px;padding:9px 10px}.rk{width:18px;text-align:center;font:400 14px var(--fd);color:var(--mute)}.pm{display:flex;flex-direction:column;align-items:flex-end;gap:1px}.pm em{font-style:normal;font-weight:900;font-size:14px}.pm em.cold{opacity:.4;filter:grayscale(1)}.pm small{font-size:11.5px;font-weight:800}.pm .due{color:var(--amber)}.pm .ok{color:var(--grass)}.pm .rest{color:var(--sky)}
.shq{display:flex;flex-wrap:wrap;gap:7px}.shq button{background:var(--card2);border:1.5px solid var(--line);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:800}.shq button:active{background:var(--amber);color:#1B1300}
.hwl{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800}.hwl span{flex:1}.hwl small{color:var(--mute);font-size:12px}.hwl.dn span{opacity:.6}
.who2{display:flex;flex-wrap:wrap;gap:7px}.picked{display:flex;flex-wrap:wrap;gap:7px}.picked button{background:var(--amber);color:#1B1300;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:900}
.tick{width:36px;height:36px;flex:none;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}.tick.on{background:var(--grass);border-color:var(--grass);color:#06231A}
.form{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px}.form label{font-size:12.5px;font-weight:800;color:var(--mute)}
.hwb{display:grid;grid-template-columns:1fr 90px 44px;gap:8px;align-items:center;font-size:14px;font-weight:800;background:var(--card);border-radius:12px;padding:9px 12px}.hwb .xp{margin:0}.hwb b{text-align:right}
.avail{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.avail button{text-align:center;border-radius:14px;padding:8px 4px;background:var(--card);border:1.5px solid var(--line);border-bottom:5px solid var(--grass)}.avail button.no{border-bottom-color:var(--red);opacity:.85}.avail b{display:block;font:400 18px var(--fd)}.avail span{display:block;font-size:12px;font-weight:800}.avail small{font-size:11px;color:var(--mute)}
.calc{background:#3A1280;border-radius:12px;padding:11px 12px;font-size:14.5px}.calc.over{border:1.5px solid var(--red);color:#FFB4B5}.ptab{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.ptab div{text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 2px}.ptab b{display:block;font-size:13.5px}.ptab small{font-size:11px;color:var(--mute);font-weight:800}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-80px);background:#F4F8FA;color:#08141C;font-weight:900;border-radius:999px;padding:10px 18px;z-index:60;transition:transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:92vw;text-align:center}#toast.on{transform:translate(-50%,0)}
.pop{position:fixed;bottom:18vh;font-size:30px;z-index:55;pointer-events:none;animation:pop 1.3s ease-out forwards}@keyframes pop{from{transform:translateY(0) scale(.5);opacity:1}to{transform:translateY(-52vh) rotate(40deg) scale(1.3);opacity:0}}
@media (max-width:360px){.cats{grid-template-columns:repeat(3,1fr)}.brand.xl{font-size:44px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.paw{font-size:54px;line-height:1;filter:drop-shadow(0 6px 0 rgba(66,20,128,.6))}.brand.xl{font-size:46px}
.cv{background:var(--amber);color:#2A1400;font:400 14px var(--fd);border-radius:999px;padding:9px 14px;box-shadow:0 4px 0 var(--gold)}.cv:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gold)}
.eqs{color:var(--ink)!important;opacity:.9}.vbtn.srch{border-style:dashed}
.nav button small{font-size:11px;text-align:center;line-height:1.1}
.prow2{--c:#fff;display:block;width:100%;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:16px;padding:10px}.pr1{display:flex;align-items:center;gap:10px}
.pr2{display:grid;grid-template-columns:auto 1fr auto auto 1fr auto;gap:5px 8px;align-items:center;margin-top:9px;font-size:12px;font-weight:800}.pr2 span{color:var(--mute)}.pr2 .xp{margin:0;height:8px}.pr2 .hwx i{background:var(--grass)}.pr2 b{min-width:30px;text-align:right}
.pr2 .dots{grid-column:2/6;display:flex;gap:4px}.pr2 .dots i{flex:1;height:8px;border-radius:4px;background:var(--c)}
.fence{position:absolute;left:0;right:0;top:0;height:26px;background:repeating-linear-gradient(90deg,#2E7D4F 0 22px,#2A7048 22px 44px);border-bottom:4px solid #FFC93D}
.bat{position:absolute;left:50%;bottom:44px;width:14px;height:92px;margin-left:34px;border-radius:8px 8px 5px 5px;background:linear-gradient(180deg,#F3D9A4,#C99A55 70%,#3A1280 70%);transform-origin:50% 100%;transform:rotate(70deg);box-shadow:2px 3px 0 rgba(0,0,0,.3)}
.bat.sw{animation:bat .28s cubic-bezier(.2,.8,.2,1) forwards}@keyframes bat{to{transform:rotate(-80deg)}}
.hitball{position:absolute;left:50%;bottom:56px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.8);animation:1s ease-out forwards}
.o-hr .hitball{animation-name:hr}.o-dbl .hitball{animation-name:dbl}.o-sgl .hitball{animation-name:sgl}.o-miss .hitball,.o-look .hitball{animation:miss .5s ease-in forwards}
@keyframes hr{to{transform:translate(40px,-330px) scale(.25);opacity:.2}}@keyframes dbl{to{transform:translate(-90px,-210px) scale(.45)}}@keyframes sgl{to{transform:translate(60px,-120px) scale(.6)}}@keyframes miss{to{transform:translate(0,46px) scale(1.1);opacity:.5}}
.outc{position:absolute;left:0;right:0;top:38%;text-align:center;font:400 34px var(--fd);color:#fff;text-shadow:3px 3px 0 var(--deep);animation:outc .45s .25s both}.o-hr .outc{color:var(--amber);font-size:40px}.o-miss .outc,.o-look .outc{color:#FFB4B5}
@keyframes outc{from{transform:scale(.3) rotate(-8deg);opacity:0}60%{transform:scale(1.15) rotate(-4deg)}to{transform:scale(1) rotate(-4deg);opacity:1}}

.goals{display:grid;grid-template-columns:1fr 1fr;gap:8px}.goal{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:11px 10px}.goal span{font-size:24px}.goal b{font-size:13.5px;font-weight:800;line-height:1.15}.goal.on{background:var(--amber);border-color:#fff;color:#2A1400}
.opts.five{grid-template-columns:repeat(5,1fr)}.opts.five button{text-align:center;padding:14px 2px}.opts.two2{grid-template-columns:1fr 1fr}.opts.two2 button{text-align:center;font:400 22px var(--fd);padding:18px 4px}
.stl{height:230px;border-radius:18px;background:linear-gradient(180deg,#1C5A3A,#2E7D4F);border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:12px}.stl .pit{font-size:72px;line-height:1}.stl b{font:400 20px var(--fd)}
.stl.go.home{background:linear-gradient(180deg,#1E7D3A,#3DDC84);border-color:#fff}.stl.go.pick{background:linear-gradient(180deg,#9E1F22,#F0484B);border-color:#fff}.stl.res b{font:800 17px var(--fb)}

.film{display:flex;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:10px}.fth{flex:none;width:104px;min-height:84px;border-radius:14px;background:linear-gradient(135deg,var(--deep),#7A1FA2 60%,var(--gold));display:flex;align-items:center;justify-content:center;text-decoration:none;border:1.5px solid var(--line)}
.fth span{width:44px;height:44px;border-radius:50%;background:var(--amber);color:#2A1400;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 0 var(--gold)}.ftx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.ftx b{font-weight:900;font-size:15.5px;line-height:1.2}.ftx small{font-size:12px;color:var(--amber);font-weight:800}.ftx p{font-size:13.5px;color:var(--mute)}.ftx .fr{margin-top:5px}

.spc{justify-content:center}.kg{color:var(--amber)}.kr{text-decoration:underline;text-decoration-color:#fff}
.wgrid{display:grid;gap:6px;justify-content:center}.wrow{display:grid;grid-template-columns:repeat(5,54px);gap:6px}.wrow i{height:54px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font:400 26px var(--fd);font-style:normal}
.wrow i.f{border-color:#fff}.wrow i.y{background:var(--amber);border-color:var(--amber);color:#2A1400}.wrow i.m{border:4px solid #fff;background:var(--card2)}.wrow i.n{opacity:.45}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center}.kb div{display:flex;gap:4px;justify-content:center;width:100%}.kb button{flex:1;max-width:34px;height:46px;border-radius:8px;background:var(--card2);font-weight:900;font-size:15px;text-align:center;padding:0}.kb .wide{max-width:58px;flex:1.7;font-size:12px}
.kb .y{background:var(--amber);color:#2A1400}.kb .m{box-shadow:inset 0 0 0 3px #fff}.kb .n{opacity:.3}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.fgrid button{min-height:64px;border-radius:12px;background:var(--card2);border:2px solid var(--line);font-weight:900;font-size:12.5px;line-height:1.15;text-align:center;padding:4px 2px;overflow-wrap:anywhere}.fgrid button.on{background:var(--deep);border-color:var(--amber);color:var(--amber);transform:scale(.96)}
.fsol{--c:#fff;background:var(--c);color:#1B1030;border-radius:12px;padding:10px;text-align:center;animation:up .25s ease-out}.fsol b{display:block;font:400 14px var(--fd)}.fsol small{font-size:13px;font-weight:800}
.fmiss{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:800;color:var(--mute)}.fmiss i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.2)}.fmiss i.on{background:var(--amber)}.fmiss span{margin-left:auto;color:#fff}
.fgrid button{overflow-wrap:normal}.fgrid button.sm{font-size:10.5px;letter-spacing:-.2px}

/* ===== retro ballpark ===== */
:root{--fp:"Press Start 2P","Courier New",monospace}
.retro{--card:#5C2B89;--card2:#7440A8;--deep:#0B0B0D;--line:#CDAE52;--mute:#EEF8E8}
.retro.full{min-height:100vh;margin-bottom:-96px;padding-bottom:40px;background:repeating-linear-gradient(90deg,#2F8A3B 0 44px,#2A7F36 44px 88px)}
.rtop{position:relative;border-bottom:4px solid #0B0B0D}.rtop svg{display:block;width:100%;height:150px}.rtop.mini svg{height:80px}.rtop.mini .hud.br{display:none}
.hud{position:absolute;background:#5C2B89;border:3px solid #CDAE52;outline:2px solid #0B0B0D;border-radius:6px;padding:6px 8px;font:400 9px/1.6 var(--fp);color:#fff;display:flex;flex-direction:column}
.hud.tl{left:8px;top:8px;max-width:56%}.hud.br{right:8px;bottom:8px;text-align:right}.hud small{color:#CDAE52;font-size:8px}.hud i{font-style:normal;color:#E0BE58}.hud b{font-weight:400}
.rchip{position:absolute;right:8px;top:8px;font:400 9px var(--fp);color:#fff;background:linear-gradient(#7B43B8,#5C2B89);border:3px solid #fff;outline:2px solid #5E4A14;border-radius:8px;padding:8px 10px;text-shadow:1px 1px 0 #5E4A14}
.arcT{position:absolute;left:0;right:0;top:12px;text-align:center;font:400 20px var(--fp);color:#fff;text-shadow:3px 3px 0 #0B0B0D}
.retro.arc{border:4px solid #0B0B0D;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(90deg,#2F8A3B 0 44px,#2A7F36 44px 88px)}.arc .rtop svg{height:120px}.arc .games{padding:12px}
.retro .gcard{background:#5C2B89;border:3px solid #CDAE52;border-radius:8px;box-shadow:0 5px 0 #0B0B0D;min-height:138px}.retro .gcard:active{transform:translateY(3px);box-shadow:0 2px 0 #0B0B0D}
.retro .gcard b{font:400 10px/1.6 var(--fp)}.retro .gcard small{color:#E6DCF5}.retro .gcard em{font:400 8px/1.5 var(--fp);color:#E0BE58}
.retro .q,.retro .fact,.retro .clues{background:#5C2B89;border:3px solid #fff;border-radius:8px;box-shadow:0 4px 0 #0B0B0D;padding:12px}.retro .q{font-size:18px}
.retro .gi{color:#fff;font-weight:800;text-shadow:1px 1px 0 #17451F}.retro .score{color:#fff}
.retro .qc{font:400 9px/1.6 var(--fp);color:#EBCB6A;text-shadow:1px 1px 0 #17451F}
.retro .opts button{border:3px solid var(--line);border-radius:8px;box-shadow:0 4px 0 #0B0B0D}.retro .opts button:active{transform:translateY(3px);box-shadow:0 1px 0 #0B0B0D}
.retro .opts .ok{background:#1F8F4E;border-color:#B9FFCF}.retro .opts .no{background:#B5343A;border-color:#FFC2C4}.retro .fact.ok{border-color:#7CFFAE}.retro .fact.no{border-color:#FF9A9D}
.opts.sm2 button{font-size:17px}
.retro .cta{font:400 12px/1.4 var(--fp);border:3px solid #fff;outline:2px solid #5E4A14;border-radius:8px;background:linear-gradient(#EBCB6A,#C9A440);box-shadow:0 5px 0 #5E4A14;padding:16px 10px}.retro .cta:active{box-shadow:0 2px 0 #5E4A14}
.retro .cta.swing{background:linear-gradient(#FF6B6E,#D8343A);color:#fff;outline-color:#6E1014;box-shadow:0 5px 0 #6E1014}.retro .cta.alt{background:linear-gradient(#8FDBFF,#4BB4EC)}
.retro .ghost{border:3px solid #fff;border-radius:8px;background:rgba(11,11,13,.6)}
.retro .prog2 i{border-radius:0;height:9px;background:rgba(11,11,13,.5)}.retro .prog2 i.on{background:#E0BE58}.retro .prog2 i.cur{background:#fff}
.retro .gend h1{font:400 16px/1.6 var(--fp);text-shadow:2px 2px 0 #0B0B0D}.retro .gend p{color:#fff;font-weight:800}
.sb{display:flex;gap:14px;align-items:center;align-self:flex-start;background:#0B0B0D;border:3px solid #CDAE52;border-radius:6px;padding:8px 12px;font:400 10px var(--fp)}
.sb div{display:grid;gap:6px}.sb span{display:flex;align-items:center;gap:5px}.sb u{text-decoration:none;width:14px}.sb i{width:11px;height:11px;background:#3F1D63}.sb .B i.on{background:#3DDC84}.sb .S i.on{background:#E0BE58}.sb .O i.on{background:#F0484B}
.clues{display:grid;gap:8px}.clues p{font-size:16px;font-weight:800}.clues b{display:block;font:400 8px/1.6 var(--fp);color:#EBCB6A}
.mv{display:block;width:100%;max-width:300px;align-self:center;border:3px solid #CDAE52;border-radius:8px}
.bf svg{display:block;width:100%;border:4px solid #0B0B0D;border-radius:8px}.spot{cursor:pointer}.spot circle{fill:#E0BE58;stroke:#0B0B0D;stroke-width:2}.spot text{fill:#0B0B0D;pointer-events:none}
.spot.ok circle{fill:#3DDC84}.spot.no circle{fill:#F0484B}.spot.dim{opacity:.35}

/* ===== levels, clock, week tracker ===== */
.q small{display:block;font:800 14px var(--fb);color:#E6DCF5;margin-top:4px}
.lvs{display:grid;gap:10px}.lvb{display:grid;gap:2px;background:#5C2B89;border:3px solid #CDAE52;border-left-width:12px;border-radius:8px;box-shadow:0 4px 0 #0B0B0D;padding:11px 12px}.lvb:active{transform:translateY(3px);box-shadow:0 1px 0 #0B0B0D}
.lvb b{font:400 13px/1.5 var(--fp)}.lvb span{font-weight:800;font-size:14.5px}.lvb em{font-style:normal;font-size:12.5px;font-weight:800;color:#EBCB6A}
.lvb.l0{border-color:#3DDC84}.lvb.l1{border-color:#E0BE58}.lvb.l2{border-color:#FF8A3D}.lvb.l3{border-color:#F0484B}
.hud.tl i{color:#E0BE58;font-size:8px}
.lives{font:400 9px var(--fp);display:flex;align-items:center;gap:6px;text-shadow:1px 1px 0 #17451F}.lives i{width:12px;height:12px;background:rgba(11,11,13,.5);border:2px solid #fff}.lives i.on{background:#F0484B}
.clock{height:10px;background:rgba(11,11,13,.5);border:2px solid #fff;overflow:hidden}.clock i{display:block;height:100%;background:#E0BE58;transform-origin:left;animation:clk linear forwards}@keyframes clk{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.pips{display:flex;gap:4px}.pips i{width:10px;height:10px;background:#3F1D63;border:1.5px solid #CDAE52}.pips i.on{background:#E0BE58;border-color:#fff}
.piplg{display:flex;gap:8px;align-items:center;margin:10px 12px 0;font-size:12.5px;font-weight:800;color:#fff}
.bf svg[data-a]{cursor:crosshair}
.wkc{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:12px}.wkh{display:flex;justify-content:space-between;align-items:baseline}.wkh b{font:400 18px var(--fd)}.wkh span{font-weight:800;color:var(--amber)}
.wkd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.wkd i{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.2);border:2px solid var(--line);font-style:normal;font-weight:900}
.wkd .on i{background:var(--grass);border-color:var(--grass);color:#06301A}.wkd .td i{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber)}.wkd small{font-size:11px;font-weight:800;color:var(--mute)}
.wks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.wks b{display:block;font:400 22px var(--fd);color:var(--amber)}.wks small{font-size:11.5px;font-weight:800;color:var(--mute)}
.wk7{display:flex;gap:3px;align-items:center}.wk7 i{flex:1;height:8px;border-radius:2px;background:rgba(255,255,255,.16)}.wk7 i.on{background:var(--grass)}
.nudges{display:grid;grid-template-columns:1fr 1fr;gap:8px}.nud{--c:#fff;background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:9px 10px;display:grid}.nud small{font-size:12px;color:var(--mute)}
.pr2 .wk7{grid-column:2/6}

/* ===== weekly plans ===== */
.plan{background:var(--card);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}.plan.open{border-color:var(--amber)}.plh{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px}.plh b{font:400 16px var(--fd)}.plh small{display:block;color:var(--mute);font-size:13px}.plh .plm{color:var(--amber);font-weight:800;margin-top:3px}.plm em{font-style:normal;background:var(--amber);color:#1B1300;border-radius:8px;padding:1px 7px}
.pld{display:grid;gap:10px;padding:0 14px 14px}.plday{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:start;border-top:1px solid var(--line);padding-top:8px}.plday>b{font-weight:900;color:var(--amber)}.plday div{display:flex;flex-wrap:wrap;gap:5px}.plday span{background:rgba(0,0,0,.2);border-radius:9px;padding:3px 8px;font-size:12.5px;font-weight:800}.plday span.g{background:var(--deep);border:1.5px solid var(--amber)}.plday small{color:var(--mute);font-weight:800;font-size:12px}
.later{display:grid;gap:6px}.later div{display:grid;grid-template-columns:92px 1fr;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px}.later b{color:var(--amber)}.later span{color:var(--mute);font-weight:700}
.plm em{white-space:nowrap}

.pgp p{color:var(--mute);font-size:14px}.pgs{color:var(--mute);font-size:13px;font-weight:700}.pgn{display:block;font:400 18px var(--fd)}.qc2{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.pgd{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}.pgd i{height:12px;border-radius:3px;background:rgba(255,255,255,.16)}.pgd i.on{background:var(--grass)}.pgd i.nx{background:var(--amber)}

/* ===== BigDawgz brand: purple, old gold, black, white ===== */
:root{--bg:#7A44B8;--bg2:#532688;--card:#7E4CC2;--card2:#9266D2;--deep:#1B1026;--amber:#E0BE58;--gold:#8F742C;--mute:#E6DCF5}
html{background:#532688}
body{background:radial-gradient(120% 55% at 50% -8%,rgba(224,190,88,.30),transparent 62%),repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 40px,transparent 40px 80px),linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed}
.top{background:#0B0B0D;border-bottom:3px solid #CDAE52;margin-bottom:12px;padding:10px 14px}.tl{display:flex;align-items:center;gap:10px}.lg{height:46px;width:auto;display:block}
.brand{color:#fff;font-style:italic;text-shadow:none;letter-spacing:.5px}.top .team{color:#E0BE58}
.lgp{background:#0B0B0D;border:3px solid #CDAE52;border-radius:26px;padding:18px 26px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}.lgp img{display:block;height:190px;width:auto}
nav{background:rgba(11,11,13,.95);border-color:#CDAE52}
.bcard{overflow:hidden;box-shadow:0 0 0 5px #0B0B0D,0 10px 30px rgba(0,0,0,.45)}.bcard::before{content:"";position:absolute;right:-14px;top:34px;width:150px;height:190px;background:var(--logo) center/contain no-repeat;opacity:.2;pointer-events:none}.bcard>*{position:relative}
.bteam{background:#0B0B0D;border:1.5px solid #CDAE52;color:#fff}
.sec{color:#fff}.sec span{color:var(--amber)}
.cta{color:#1B1026}.rchip{border-color:#CDAE52;outline-color:#0B0B0D;text-shadow:1px 1px 0 #0B0B0D}
.arcT{font-style:italic}
.todo-box{display:grid;gap:10px;background:#0B0B0D;border:3px solid #CDAE52;border-radius:22px;padding:14px}.todo-box .sec{margin:0;font-size:22px}.todo-box .empty{background:rgba(255,255,255,.06)}

/* ===== more BigDawgz purple (#5C2B89) ===== */

/* ===== organization pass ===== */

.gh{margin:14px 12px 0;font:400 11px/1.5 var(--fp);color:#fff;text-shadow:2px 2px 0 #0B0B0D;display:flex;justify-content:space-between;align-items:baseline;gap:8px}.gh span{font:800 12px var(--fb);color:#EBCB6A;text-shadow:none}
.rowb{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}.rowb>span:first-child{font-size:24px}.rowb small{display:block;color:var(--mute);font-size:13px}

.thw{position:relative;flex:none;width:124px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#0B0B0D;border:1.5px solid #CDAE52;display:block}.thw img{width:100%;height:100%;object-fit:cover;display:block}
.thw i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px;color:#fff;text-shadow:0 2px 8px #000;background:rgba(0,0,0,.18)}
.fth{position:relative;overflow:hidden;width:124px;min-height:0;aspect-ratio:16/9;align-self:flex-start;background:#0B0B0D;border-color:#CDAE52}.fth img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.fth span{position:relative;font-size:22px;color:#fff;text-shadow:0 2px 8px #000}

/* ===== accounts ===== */
.authp{padding:20px 18px 40px;display:grid;gap:14px;justify-items:center}.authp .form,.authp .seg{width:100%;max-width:420px}.seg.two{grid-template-columns:1fr 1fr}.seg.two button{padding:11px 4px;font-size:15px}
.amsg{background:#3F1D63;border:1.5px solid #CDAE52;border-radius:12px;padding:9px 12px;font-weight:800;font-size:14px}
.acc{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:11px 12px;display:grid;gap:9px}.acch{display:flex;align-items:center;gap:10px;justify-content:space-between}.acch small{display:block;color:var(--mute);font-size:13px}
.accr{display:flex;gap:6px;flex-wrap:wrap}.accr input{flex:1;min-width:120px;background:#3F1D63;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:700;color:var(--ink)}.ghost.warn{border-color:#F0484B;color:#FFD0D1}
.lnk{font:inherit;color:var(--amber);font-weight:900;text-transform:uppercase}

.pvb{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#E0BE58;color:#1B1026;padding:8px 14px;font-size:13px;font-weight:800;margin:-12px 0 12px}.pvb button{flex:none;background:#1B1026;color:#fff;border-radius:10px;padding:7px 10px;font-weight:900;font-size:12.5px}

d("a1","arm","Cleary Mobility (12U)",8,1,"solo","inside","Floor space","Loosens hips, back and shoulders. Always first, before anything else.",["Hip 90/90: sit with both knees bent at 90°, switch sides slowly. 10 each way.","ATG lunge: long lunge, back knee down, push the front knee forward. 8 each leg.","Cat-cow (spinal hygiene): on hands and knees, round your back, then arch. 10 slow.","Yoga push-up to cobra: push hips up, then drop hips and look up. 5 slow.","Wall windmill: side to a wall, draw a big circle with your arm. 8 each side.","Shoulder taps: push-up position, tap opposite shoulder. 10 each."],["Slow and smooth","Breathe out as you stretch","Nothing should hurt"],"Race the clock: can you do every move with perfect form in 8 minutes?","", "Mobility A–D"),
d("a2","arm","Cleary Pre-Throw (12U)",6,1,"solo","yard","Light ball or 2 lb med ball","Gets your body moving in the right order before you pick up a baseball.",["Front Load & Ride x5 each side.","Inward Turn x5 each side.","Reverse Lunge to Throw x3 each side.","Bauers x3 each side.","Follow the coach's video for each move. Go at half speed; this is a warm-up, not a workout."],["Legs first, arm last","Stay smooth","Light ball only"],"Mirror it: do each move in front of a mirror and try to copy the video exactly.",V.flr,"Pre-Throw 1–3"),
d("a3","arm","Reverse Throw",3,1,"solo","yard","Baseball or soft ball, wall or net","First move of the Cleary plyo warm-up. Wakes up the back of your shoulder.",["Stand with your back to the wall, a few steps away.","Hold the ball out front, then throw it backward over your shoulder into the wall.","Easy effort. 10 throws."],["Easy, not hard","Elbow stays up","Finish tall"],"Count how many of 10 hit the wall in the same spot.",V.rev,"Plyo 1–3"),
d("a4","arm","Arm Action Freestyle",3,1,"solo","yard","Baseball or soft ball, wall or net","Lets your arm find its own smooth path.",["Stand sideways to the wall.","Let your arm swing through its natural throwing circle and flip the ball into the wall.","8 each. Keep it loose and easy."],["Loose arm","Let it swing","No muscling"],"Try it with your eyes closed for 3 reps and feel the path.",V.aaf,"Plyo 1–3"),
d("a5","arm","Pivot Pick-Off",3,1,"solo","yard","Baseball or soft ball, wall or net","Teaches your chest and hips to turn before your arm goes.",["Stand with your chest facing the wall, feet wide.","Turn your shoulders back, then rotate and throw without moving your feet.","5 throws at easy-to-medium effort."],["Turn, then throw","Feet stay planted","Chest finishes at the target"],"Put a target on the wall. 5 throws, how many hits?","","Plyo 1–3"),
d("a6","arm","Lasso",3,2,"solo","yard","Baseball or soft ball, wall or net","Builds a smooth, connected arm circle.",["Follow the coach's video.","5 throws, medium effort."],["Smooth circle","Stay relaxed"],"",V.lasso,"Plyo 1–2"),
d("a7","arm","Figure 8 Rocker",3,2,"solo","yard","Baseball or soft ball, wall or net","Adds rhythm and weight shift to your throw.",["Stand sideways, feet wide.","Draw a figure 8 with the ball while you rock back and forth.","On the last rock forward, throw. 3 each."],["Rock back, rock forward","Stay sideways","Throw on rhythm"],"Say 'back, front, throw' out loud to keep the rhythm.",V.f8,"Plyo 1–2"),
d("a8","arm","Turn & Burns",3,3,"solo","yard","Baseball, wall or net","The last and fastest plyo drill. Only on high days.",["Follow the coach's video.","3 throws. This is the only one that gets close to full effort."],["Full warm-up first","Stay on line"],"",V.tb,"Plyo 1"),
d("a9","arm","Post-Throw: Scap",6,1,"solo","inside","Floor","Arm care after you throw. Builds the small muscles behind your shoulder.",["Lie face down. Lift arms into an I, hold 5 seconds. 10 reps.","Same for Y, then T, then W. No weight.","Finish with 2 x 30 seconds squeezing a tennis ball (forearm)."],["Thumbs up","Squeeze shoulder blades","Slow"],"Have someone balance a paper cup on your back. Don't spill it.","","Scap 1–3"),
d("a10","arm","Post-Throw: Rotator Cuff",6,2,"solo","inside","Light band","Arm care after you throw. Keeps your shoulder strong and steady.",["Band pull-aparts: 2 x 12.","ER walk-outs: band at elbow height, elbow at your side, step away and hold. 2 x 8.","Elbow stays glued to your ribs."],["Light band","Slow both ways","Stop if it pinches"],"","","Rotator Cuff 2"),
d("a11","arm","Post-Throw: Mobility",5,1,"solo","inside","None","Arm care after you throw. Keeps your shoulder and elbow moving freely.",["Shoulder CARs: biggest, slowest arm circle you can. 5 each way.","Elbow CARs: bend, turn palm up and down, straighten. 10.","Scap CARs: shrug up, back, down, forward. 10.","Thoracic extension over a chair back or foam roller. 10."],["Slow circles","Rest of your body stays still"],"","","Mobility 1–3"),
// ---- THROWING ----
d("t1","throw","Four-Seam Grip Check",3,1,"solo","inside","Baseball","A four-seam grip makes the ball fly straight.",["Toss the ball up and catch it.","Without looking, find the horseshoe and put two fingers across the seams.","Check. 20 tosses."],["Fingers across the horseshoe","Thumb underneath","Hold it like an egg"],"Race a sibling: who gets 10 perfect grips first?"),
d("t2","throw","One-Knee Throws",5,1,"partner","yard","Baseball, glove","Takes your legs away so you can feel your arm path and release.",["Throwing-side knee down, front foot at your partner, about 20 feet apart.","Turn your shoulders, elbow up, throw to your partner's chest.","15 throws."],["Glove side points","Elbow at shoulder height","Finish across your body"],"Chest = 2 points, head = 1. First to 15."),
d("t3","throw","Power Position Throws",5,1,"partner","yard","Baseball, glove","Starts you in the strongest spot of the throw.",["Stand sideways, feet wider than shoulders, arms in a T.","Shift back, then forward and throw.","15 throws at 30–40 feet."],["Sideways first","Back to front","Chest over front knee"],""),
d("t5","throw","Step-Behind Throws",5,2,"partner","field","Baseball, glove","Adds momentum, like an infielder making a play.",["Catch the ball, step your back foot behind your front foot.","Stay sideways, then throw through your partner.","15 throws at 50–60 feet."],["Gain ground","Stay closed","Throw through, not to"],""),
d("t6","throw","Wall Ball Target",8,1,"solo","yard","Tennis or rubber ball, wall, tape or chalk","Accuracy beats arm strength. This is the best solo drill there is.",["Tape or chalk a square about chest high.","Start 20 feet away. Throw 10.","Hit 7 of 10? Take two steps back."],["Pick a small spot","Same motion every time"],"Play 21: square = 2 points, close = 1. How few throws to reach 21?"),
d("t7","throw","Quick Hands",5,2,"partner","yard","Baseball, glove","Gets the ball out of your glove fast.",["Stand 15–20 feet apart.","Catch and throw as fast as you can with good throws.","30 seconds, count the catches. Rest and repeat 3 times."],["Catch in the middle","Two hands","Short steps"],"Beat your count every round."),
d("t8","throw","Catch Play 21",8,1,"partner","yard","Baseball, glove","Makes every throw of catch count.",["Play catch at a normal distance.","Throw at the head = 2 points, chest = 1, anywhere else = 0.","First to 21 wins."],["Hit the target","Receiver gives a two-hand target"],"It already is one. Loser carries the bucket."),
d("t9","throw","Long Toss Ladder (12U)",10,2,"partner","field","Baseball, glove","Builds arm strength the safe way: stretch it out, then come back in.",["Start at 30 feet. 5 throws.","Step back 10 feet every 5 throws. Keep an easy arc.","Stop at the last distance you can reach on a line with no pain.","Come back in the same way."],["Easy arc going out","On a line coming in","Never through pain"],"Count total catches without a drop on the way back in.","","Catch play"),
d("t10","throw","Crow Hop Throws",6,2,"partner","field","Baseball, glove","How outfielders and infielders get everything behind a long throw.",["Catch, then hop: back foot replaces front foot.","Land sideways, throw.","10 throws at 60–80 feet."],["Hop forward, not up","Stay sideways","Follow your throw"],""),
d("t11","throw","Relay Line",8,2,"team","field","Baseballs, gloves","Team throwing under a little pressure.",["Lines of 4, each player 40–50 feet apart.","Ball goes down the line and back. Turn glove side.","Race the other lines."],["Hands up, yell 'hit me'","Turn glove side","Quick feet"],"First line to finish 3 trips wins."),
d("t12","throw","Bucket Toss",5,1,"solo","yard","Bucket, 10 balls","Touch and feel, like a throw to a base.",["Set a bucket on its side 30–40 feet away.","Throw so the ball takes one hop into the bucket.","10 throws."],["One hop","Aim small"],"Keep a high score on the bucket with tape."),
// ---- PITCHING ----
d("p1","pitch","Balance Point Holds",4,1,"solo","inside","None","Every good delivery passes through balance.",["From the stretch, lift your front knee to your belt.","Hold for 3 seconds without wobbling.","10 reps. Then 5 with your eyes closed."],["Tall, not leaning","Hands in the middle","Eyes on the target"],"Who can hold it longest?"),
d("p3","pitch","Rocker Throws",5,1,"partner","yard","Baseball, glove","Rhythm and weight shift.",["Stride position, feet already apart.","Rock back, rock forward, throw.","15 throws."],["Back, forward, throw","Head stays over your belt"],"",V.f8),
d("p4","pitch","Stride Line",5,1,"solo","yard","Tape or chalk line","Teaches you to go straight to the plate.",["Make a line from the middle of your back foot toward the target.","Do your delivery with no ball.","Check: did your front foot land on the line? 10 reps."],["Stride to the plate","Land soft","Toes at the target"],"10 in a row on the line."),
d("p5","pitch","Walking Windup",5,2,"partner","field","Baseball, glove","Momentum toward the plate.",["Take a walking step behind, then go into your leg lift without stopping.","Throw to your partner.","10 throws."],["Keep moving","Don't rush your arm"],"",V.ww),
d("p6","pitch","Strike Zone 3x3",8,2,"partner","field","Baseball, catcher or target","Command wins at 12U. Fastballs for strikes.",["Flat ground or mound, at your game distance.","Throw 3 to the glove side, 3 middle, 3 arm side.","Count strikes out of 9."],["Same delivery to every spot","Eyes on the glove"],"Beat your score. 7 of 9 is an ace."),
d("p7","pitch","Changeup Feel",6,2,"partner","yard","Baseball, glove","A changeup is the best second pitch at this age. Same arm speed, different grip.",["Hold the ball deeper in your hand with a circle or three-finger grip.","Play catch at 40 feet with only that grip.","15 throws. Fastball arm speed."],["Same arm speed","Let the grip slow it down"],"Have your partner guess: fastball or changeup?"),
d("p8","pitch","Bullpen: 20-Pitch Plan",12,3,"partner","field","Mound, catcher","A short, planned bullpen. Fastball and changeup only.",["Full warm-up first.","10 fastballs: 5 glove side, 5 arm side.","5 changeups.","5 fastballs: catcher calls the spot. Count strikes."],["Stay at 20","Quality over quantity","Arm care after"],"Strike on the last pitch or you owe the catcher a high five.","","Bullpen day"),
d("p9","pitch","PFP: Cover First",6,2,"team","field","Baseballs, bases","Pitchers are fielders too.",["Coach rolls a ball to the first-base side.","Pitcher sprints to the line, then runs up it to the bag.","Take the toss, touch the inside of the base. 5 reps each."],["Get to the line first","Find the bag early","Inside of the base"],""),

d("h1","hit","Dry Swings (Mirror)",5,1,"solo","inside","Bat, mirror or window","See your own swing. Great pros still do this.",["Stand where you can see your reflection.","10 slow-motion swings, 10 at game speed.","Check: balanced finish every time?"],["Athletic stance","Head still","Finish balanced"],"Freeze at contact. Is your back knee pointing at the pitcher?"),
d("h2","hit","Tee: Middle",8,1,"solo","yard","Tee, balls, net or fence","The tee is where swings get built.",["Tee at belt height, even with your front foot.","Hit line drives back up the middle.","2 sets of 10."],["Line drive, not ground ball","Hit the inside of the ball"],"Line drives count 1, everything else 0. Beat your best of 10."),
d("h3","hit","Tee: Inside / Outside",8,2,"solo","yard","Tee, balls, net","Learn where to hit each pitch.",["Inside pitch: tee out in front, pull it.","Outside pitch: tee deeper and away, hit it the other way.","10 each."],["Inside: catch it out front","Outside: let it travel"],"Call your field before you swing."),

d("h5","hit","Stride and Separate",5,2,"solo","inside","Bat","Getting to a strong launch position on time.",["Take your stride. Freeze.","Check: hands back, weight still back, front foot down soft.","10 freezes, then 10 full swings."],["Stride soft","Hands stay back","Then swing"],""),
d("h6","hit","Soft Toss",8,1,"partner","yard","Balls, net, helper","Timing a moving ball.",["Helper kneels to the side and a little in front.","Soft underhand toss into the zone.","2 sets of 10 line drives."],["See it, then swing","Same swing as the tee"],"Helper calls 'high' or 'low' mid-toss; adjust."),
d("h7","hit","Front Toss",10,2,"partner","field","L-screen, balls, helper","The closest thing to live pitching.",["Helper tosses firm underhand from 15–20 feet behind a screen.","Hit hard line drives.","3 rounds of 8."],["Be on time","Hit it where it's pitched"],"Line drive past the screen = 1 point."),
d("h8","hit","Pause Drill",6,3,"solo","yard","Tee, balls","Fixes lunging.",["Stride and pause for a full second.","Then swing.","10 swings."],["Stay back","Head between your feet"],""),
d("h9","hit","Bunt to the Cones",6,1,"partner","field","Bat, balls, 4 cones","Bunting wins games at 12U.",["Make two cone gates: one up each line.","Pivot, bat out front, catch the ball with the bat.","10 bunts. Through a gate = 1 point."],["Bat head above hands","Bend knees for low pitches","Soft hands"],"Play to 5 against a teammate."),
d("h10","hit","Two-Strike Battle",8,2,"partner","field","Front toss setup","Putting the ball in play when you have to.",["Choke up, widen out.","Every pitch near the zone you must swing.","Foul = alive. Miss = out. How many pitches can you stay alive?"],["Shorten up","Protect the plate"],"Longest at-bat wins."),
d("h11","hit","Number Call (Pitch Tracking)",5,1,"partner","yard","Helper","Teaches you to see the ball out of the hand.",["Helper goes through a throwing motion and holds up fingers at release.","Call the number as fast as you can.","15 reps."],["Eyes to the release point","Call it early"],"Speed round: 10 in a row correct."),
// ---- INFIELD ----

d("f3","field","Hat Drill",4,1,"partner","yard","Ball, glove, cap","Makes you watch the ball all the way in.",["Flip your cap over and bite the brim so it sticks out.","Field rolled ground balls.","You can only see the ball if your glove is out front. 10 reps."],["Reach","Watch it in"],"It looks silly. That's the fun."),

d("f7","field","Four Corners",8,2,"team","field","Baseballs, 4 bases","Catching, footwork and throwing around a square.",["A player at each corner, 40–60 feet apart.","Throw around the square, follow your throw.","Reverse on the whistle."],["Move your feet to the ball","Turn glove side"],"How many in a row without a drop?"),
d("f8","field","Slow Roller",6,3,"partner","field","Baseballs","The do-or-die play.",["Coach rolls a slow ball.","Charge, field outside your glove-side foot, throw on the run.","5 reps."],["Charge under control","Field off the left foot (righty)","Throw across your body"],""),
d("f9","field","Double Play Feeds",8,3,"team","field","Baseballs, base","Shortstop and second base working together.",["Rolled ball to short: underhand flip to second.","Rolled ball to second: pivot or backhand flip to short.","10 each."],["Show the ball","Follow your flip","Chest high"],""),
d("f10","field","Pop-Up Priority",6,2,"team","field","Tennis or baseballs","Who calls it, and who gets out of the way.",["Coach throws pop-ups between two players.","Loud 'Mine! Mine! Mine!' Other player peels off.","Outfielders have priority over infielders."],["Call it three times","Catch above your eyes"],"Silent ball = both run a lap."),

d("r2","run","Question Mark Turn",5,1,"solo","field","Base","How to round first for a double.",["Halfway down the line, bow out a little.","Touch the inside corner with either foot.","Find the ball. 5 reps."],["Bow out early","Inside corner","Eyes up"],""),

d("r4","run","Dirt Ball Read",6,2,"team","field","Balls, catcher","Stealing a free base on a ball in the dirt.",["Runner at first. Coach throws to a catcher.","Ball in the dirt: go on the bounce.","Caught clean: hustle back."],["Read the angle down","Go on the bounce"],""),
d("r5","run","Tag Up",5,1,"team","field","Balls","Scoring on a fly ball.",["Runner on third, foot on the bag.","Watch the catch yourself.","Go the instant it touches the glove."],["Foot on the base","Watch the catch","Explode"],""),

// ---- IQ ----

     <div class="fr"><button class="fchip ${pl.st==="next"?"on":""}" data-a="plst:next">Start next Monday (${nice(addDays(mon,7))})</button><button class="fchip ${pl.st==="this"?"on":""}" data-a="plst:this">Start this week (today on)</button></div>

     <button class="cta" data-a="plsend" ${pl.who==="all"||pl.sel.length?"":"disabled"}>Send ${left} day${left===1?"":"s"} to ${pl.who==="all"?"everyone":pl.sel.length+" player"+(pl.sel.length===1?"":"s")}</button></div>`:""}</div>`};
  return topbar("Weekly plans","Pick a week, check it, send it")+`<main><button class="back" data-a="go:team">‹ Coach's View</button>
   <div class="note2"><b>How every day works</b><ul><li>1. Move: mobility or body control.</li><li>2. Skill: one to three short drills, all doable in a living room.</li><li>3. Play: one app game. Players pick their own level.</li><li>No throwing drills. Everything is at-home work.</li><li>Each day shows up on the player's Home screen on its own day.</li></ul></div>
   ${PHASES.map(ph=>`<h3 class="sec">${ph[1]}</h3><p class="gi">${ph[2]}</p>${TPL.filter(t=>t.ph===ph[0]).map(card).join("")}`).join("")}</main>`+nav()}

/* ===== online accounts (username + password, shared team data) ===== */
function emptyS(){return{v:2,team:"BigDawgz 12U",who:null,peek:false,players:[],vids:{},fadd:[],fhide:[],custom:[],plan:null,sent:{},throwOpen:false}}
function nid(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}
async function rpc(fn,args){let r;try{r=await fetch(NET.url+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:NET.key,"Content-Type":"application/json"},body:JSON.stringify(args||{})})}catch(e){throw new Error("offline")}const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}if(!r.ok)throw new Error((j&&j.message)||"error");return j}
const NERR={bad_login:"Wrong username or password.",taken:"That username is taken. Try another.",bad_code:"That team code isn't right. Ask your coach.",bad_username:"Usernames are 3 to 20 letters or numbers, no spaces.",short_password:"Passwords need at least 6 characters.",need_name:"Add your name.",offline:"Can't reach the team right now. Check your internet.",signed_out:"Please sign in again.",last_coach:"There has to be at least one coach.",short_code:"The code needs at least 4 characters.",not_yourself:"You can't remove your own account."};
const nmsg=e=>NERR[e.message]||"Something went wrong. Try again.";
function blankP(u){return{id:u.id,n:u.name,num:u.num||0,pos:u.pos||"",col:COLS[hash(String(u.id))%COLS.length],xp:0,streak:0,last:"",done:{},cats:{},hw:[],badges:[],fav:[],tri:[0,0],best:{},shouts:[],pitch:[],log:[],act:{},got:{}}}
function mergeInbox(p,items){let ch=false;p.got=p.got||{};const live={};(items||[]).forEach(it=>{live[it.aid]=1;if(p.got[it.aid])return;p.got[it.aid]=1;ch=true;if(it.kind==="shout")p.shouts.push({t:it.t,at:it.at,aid:it.aid});else if(it.kind==="pitch")p.pitch.push({d:it.d,n:it.n,aid:it.aid});else if(it.hw&&DRok(it.hw.id))p.hw.push(Object.assign({},it.hw,{aid:it.aid}))});Object.keys(p.got).forEach(k=>{if(!live[k])delete p.got[k]});return ch}
function DRok(id){return true}
function teamDoc(){return{team:S.team,vids:S.vids,fadd:S.fadd||[],fhide:S.fhide||[],custom:S.custom||[],plan:S.plan||null,sent:S.sent||{},throwOpen:!!S.throwOpen}}
function applyServer(r){ME=r.user;const T=r.team||{},base=Object.assign(emptyS(),{team:T.team||"BigDawgz 12U",vids:T.vids||{},fadd:T.fadd||[],fhide:T.fhide||[],custom:T.custom||[],plan:T.plan||null,sent:T.sent||{},throwOpen:!!T.throwOpen});
  const mk=(u,doc,inbox)=>{const p=Object.assign(blankP(u),doc||{});p.id=u.id;p.n=u.name;p.num=u.num||0;p.pos=u.pos||"";const ch=mergeInbox(p,inbox);return[p,ch]};let dirty=false;
  if(ME.role==="coach"){ROSTER=r.roster||[];CODE=r.code||"";base.who="coach";base.players=ROSTER.filter(x=>x.role==="player").map(x=>mk(x,x.doc,x.inbox)[0]);netLast=JSON.stringify(T&&T.team?teamDocOf(base):null)}
  else{const m=mk(ME,r.doc,r.inbox);base.who=ME.id;base.players=[m[0]];dirty=m[1]||!r.doc}
  S=base;(S.custom||[]).forEach(addCustom);S.players.forEach(p=>{p.hw=p.hw.filter(h=>DR[h.id])});window._mig=1;return dirty}
function teamDocOf(b){return{team:b.team,vids:b.vids,fadd:b.fadd,fhide:b.fhide,custom:b.custom,plan:b.plan,sent:b.sent,throwOpen:b.throwOpen}}
async function netBoot(){try{TOK=localStorage.getItem("dz-token")}catch(e){}if(!TOK){render();return}auth.busy=true;auth.msg="Loading your team…";render();
  try{const dirty=applyServer(await rpc("dz_sync",{p_tok:TOK}));auth.busy=false;auth.msg="";view=isCoach()?"team":"home";render();if(dirty)netSave()}catch(e){auth.busy=false;if(e.message==="signed_out"){TOK=null;try{localStorage.removeItem("dz-token")}catch(x){}auth.msg=""}else auth.msg=nmsg(e);render()}}
async function netAuth(up){if(auth.busy)return;const g=id=>(($("#"+id)||{}).value||"").trim(),un=g("au"),pw=($("#ap")||{}).value||"";if(!un||!pw){auth.msg="Type your username and password.";render();return}
  const keep={au:un,an:g("an"),anum:g("anum"),apos:g("apos"),ac:g("ac")};auth.keep=keep;auth.busy=true;auth.msg=up?"Creating your account…":"Signing in…";render();
  try{const r=up?await rpc("dz_signup",{p_uname:un,p_pw:pw,p_name:keep.an,p_num:keep.anum?+keep.anum:null,p_pos:keep.apos,p_code:keep.ac}):await rpc("dz_login",{p_uname:un,p_pw:pw});TOK=r.token;try{localStorage.setItem("dz-token",TOK)}catch(e){}
    const dirty=applyServer(await rpc("dz_sync",{p_tok:TOK}));auth={mode:"in",msg:"",busy:false};view=isCoach()?"team":"home";render();scrollTo(0,0);if(dirty)netSave();toast("Welcome, "+ME.name+"!")}catch(e){auth.busy=false;auth.msg=nmsg(e);render()}}
async function netOut(skip){const t=TOK;if(!skip)await netFlush();clearTimeout(netT);TOK=null;ME=null;try{localStorage.removeItem("dz-token")}catch(e){}S=emptyS();view="auth";auth={mode:"in",msg:"",busy:false};render();try{await rpc("dz_logout",{p_tok:t})}catch(e){}}
function netSave(){clearTimeout(netT);netT=setTimeout(netFlush,600)}
async function netFlush(){clearTimeout(netT);if(!NET||!TOK||!ME||S.peek)return;try{
    if(isCoach()){for(const p of S.players){const items=[];p.hw.forEach(h=>{if(!h.aid){h.aid=nid();items.push({aid:h.aid,hw:h})}});p.shouts.forEach(x=>{if(!x.aid){x.aid=nid();items.push({aid:x.aid,kind:"shout",t:x.t,at:x.at})}});(p.pitch||[]).forEach(x=>{if(!x.aid){x.aid=nid();items.push({aid:x.aid,kind:"pitch",d:x.d,n:x.n})}});if(items.length)await rpc("dz_push",{p_tok:TOK,p_uids:[p.id],p_items:items})}
      const T=JSON.stringify(teamDoc());if(T!==netLast){await rpc("dz_team_save",{p_tok:TOK,p_team:teamDoc()});netLast=T}}
    else if(me())await rpc("dz_sync",{p_tok:TOK,p_doc:me()})}catch(e){if(e.message==="signed_out"){netOut(true)}else{toast("Not saved yet. Will try again.");netT=setTimeout(netFlush,8000)}}}
async function netPull(loud){if(!NET||!TOK||!ME||G||S.peek)return;try{await netFlush();const coach=isCoach(),keepView=view,r=await rpc("dz_sync",coach?{p_tok:TOK}:{p_tok:TOK,p_doc:me()});const dirty=applyServer(r);if(isCoach()!==coach)view=isCoach()?"team":"home";else view=keepView;if(!sheet&&!G&&!document.querySelector("input:focus,textarea:focus,select:focus"))render();if(dirty)netSave();if(loud)toast("Up to date")}catch(e){if(e.message==="signed_out"){if(ME)netOut(true)}else if(loud)toast(nmsg(e))}}
document.addEventListener("visibilitychange",()=>{if(NET&&!document.hidden)netPull(false)});setInterval(()=>{if(NET&&!document.hidden&&(view==="home"||view==="team"))netPull(false)},90000);
async function netAdmin(act,uid,val){try{await rpc("dz_admin",{p_tok:TOK,p_action:act,p_uid:uid,p_val:val});toast({role:"Role updated",pw:"Password reset",remove:"Account removed",code:"Team code changed"}[act]);await netPull(false);render()}catch(e){toast(nmsg(e))}}

  ${auth.msg?`<p class="amsg" role="status">${esc(auth.msg)}</p>`:""}<button class="cta" data-a="${up?"auup":"auin"}" ${auth.busy?"disabled":""}>${up?"Create my account":"Sign in"}</button></div>
